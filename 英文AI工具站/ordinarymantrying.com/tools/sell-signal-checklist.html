<style>
  :root{
    --bg-1:#1a1008; --bg-2:#2c1e0a;
    --device:#120c05; --bezel:#080503;
    --screen:#FAFAF6; --ink:#201a10; --muted:#6b5f42;
    --line:#ddd5c0;
    --accent:#C2553D; --accent-soft:#fdf0ec; --accent-ink:#fff;
    --hold:#2A6B38; --hold-soft:#e6f4e9;
    --warn:#B07A2B; --warn-soft:#fef3e2;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--ink);
    background:radial-gradient(120% 120% at 50% 0%,var(--bg-2),var(--bg-1));
    display:flex; align-items:center; justify-content:center; padding:20px; min-height:100%;
  }
  .phone{
    width:370px; max-width:100%; height:760px; max-height:94vh;
    background:linear-gradient(160deg,#1e150a,var(--device));
    border-radius:46px; padding:13px;
    box-shadow:0 2px 0 #2a1e0e inset,0 40px 80px -30px #000,0 0 0 2px var(--bezel);
    position:relative; display:flex; flex-direction:column;
  }
  .notch{
    position:absolute; top:13px; left:50%; transform:translateX(-50%);
    width:138px; height:26px; background:var(--bezel); border-radius:0 0 18px 18px; z-index:5;
  }
  .screen{
    flex:1; background:var(--screen); border-radius:34px;
    overflow:hidden; display:flex; flex-direction:column; position:relative;
  }
  .statusbar{
    flex:0 0 auto; padding:14px 22px 8px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .badge{
    font-family:var(--mono); font-size:12px; font-weight:700;
    color:var(--accent); background:var(--accent-soft);
    padding:4px 10px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .badge.show{opacity:1}
  .content{
    flex:1 1 0; overflow-y:auto; padding:6px 22px 18px;
    display:flex; flex-direction:column;
    transition:opacity .24s ease,transform .24s ease;
    -webkit-overflow-scrolling:touch;
  }
  .content.leaving{opacity:0; transform:translateY(6px)}
  .content.blank{opacity:0}
  .btm{
    flex:0 0 auto; padding:10px 22px 18px;
    background:var(--screen); border-top:1px solid var(--line);
  }
  .eyebrow{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); font-weight:800; margin-bottom:12px}
  h1{font-size:26px; line-height:1.2; font-weight:800; letter-spacing:-.02em; margin-bottom:10px}
  h2{font-size:19px; line-height:1.25; font-weight:800; margin-bottom:4px}
  .lead{font-size:14px; line-height:1.55; color:var(--muted); margin-bottom:18px}
  .spacer{flex:1 1 auto; min-height:10px}
  .btn{
    appearance:none; border:none; cursor:pointer; width:100%;
    font-family:var(--sans); font-size:15px; font-weight:700; padding:14px;
    border-radius:14px; background:var(--accent); color:var(--accent-ink);
    transition:transform .08s,filter .12s; margin-bottom:8px; display:block;
  }
  .btn:active{transform:scale(.985)} .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent; color:var(--muted); font-size:13px; font-weight:600; padding:10px}
  .btn:disabled{opacity:.35; cursor:not-allowed}
  .field{margin-bottom:20px}
  .field label{display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:7px}
  .field input{
    width:100%; font-size:20px; font-weight:700; color:var(--ink);
    background:#fff; border:1.5px solid var(--line); border-radius:12px;
    padding:11px 13px; outline:none; font-family:var(--sans); transition:border-color .15s;
  }
  .field input:focus{border-color:var(--accent)}
  .field input::placeholder{color:#c8b89a; font-weight:400}
  .pbar-wrap{height:3px; background:var(--line); border-radius:99px; margin-bottom:16px}
  .pbar{height:100%; width:0%; background:var(--accent); border-radius:99px; transition:width .3s}
  .sec{font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--accent); margin-top:14px; margin-bottom:7px; padding-bottom:5px; border-bottom:1px solid var(--line)}
  /* question rows — yes/no */
  .qrow{padding:10px 0; border-bottom:1px solid var(--line)}
  .qrow:last-child{border-bottom:none}
  .qtext{font-size:13.5px; line-height:1.45; color:var(--ink); margin-bottom:9px}
  .toggle-row{display:flex; gap:8px}
  .tog{
    flex:1; appearance:none; border:1.5px solid var(--line);
    border-radius:10px; font-family:var(--sans); font-size:13px; font-weight:700;
    padding:9px 0; cursor:pointer; background:#fff; color:var(--muted);
    transition:background .12s,border-color .12s,color .12s;
  }
  .tog.yes.sel{background:var(--accent); border-color:var(--accent); color:#fff}
  .tog.no.sel{background:var(--hold); border-color:var(--hold); color:#fff}
  /* results */
  .score-row{display:flex; align-items:baseline; gap:6px; margin:2px 0 4px}
  .score-num{font-family:var(--mono); font-size:62px; font-weight:800; line-height:1}
  .score-den{font-size:18px; font-weight:700; color:var(--muted)}
  .tier-name{font-size:15px; font-weight:800; margin-bottom:3px}
  .tier-note{font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:14px}
  .key-flag{background:var(--accent-soft); border-radius:10px; padding:11px 13px; margin-bottom:10px}
  .key-flag .kf-label{font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:var(--accent); margin-bottom:4px}
  .key-flag .kf-text{font-size:13px; line-height:1.5; color:var(--ink)}
  .q-summary{margin-bottom:14px}
  .qs-row{display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--line)}
  .qs-row:last-child{border-bottom:none}
  .qs-pill{flex:0 0 34px; font-size:11px; font-weight:800; padding:2px 6px; border-radius:5px; text-align:center}
  .qs-pill.sell{background:var(--accent); color:#fff}
  .qs-pill.hold{background:var(--hold-soft); color:var(--hold)}
  .qs-text{font-size:12.5px; line-height:1.4; color:var(--muted)}
  .sharehead{font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:var(--muted); margin:14px 0 8px; text-align:center}
  .sharegrid{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:10px}
  .share{
    appearance:none; border:none; cursor:pointer; color:#fff;
    font-family:var(--sans); font-size:13px; font-weight:700;
    padding:11px 8px; border-radius:11px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .08s,filter .12s;
  }
  .share:active{transform:scale(.97)} .share:hover{filter:brightness(1.08)}
  .s-x{background:#000} .s-wa{background:#25D366}
  .s-tg{background:#229ED9} .s-cp{background:#3a4850}
  .backlink{display:block; text-align:center; font-size:12px; color:var(--muted); text-decoration:none; padding:8px 0; margin-top:2px}
  .backlink:hover{color:var(--accent)}
  .toast{
    position:absolute; left:50%; bottom:24px;
    transform:translateX(-50%) translateY(18px);
    background:var(--ink); color:#fff; font-size:13px; font-weight:600;
    padding:10px 16px; border-radius:999px;
    opacity:0; pointer-events:none; white-space:nowrap;
    transition:opacity .22s,transform .22s; z-index:30;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){.content,.btn,.tog,.pbar,.share{transition:none}}
</style>

<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="statusbar">
      <span class="brand">Sell Check</span>
      <span class="badge" id="badge">0 / 6</span>
    </div>
    <div class="content" id="content"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script>
const TOOL_URL    = "https://ordinarymantrying.com/tools/sell-signal-checklist.html";
const ARTICLE_URL = "https://ordinarymantrying.com/the-two-stocks-i-held-for-years-that-i-should-have-sold-much-earlier/";

/* Questions: answer YES = sell signal, NO = hold signal */
const QUESTIONS = [
  {
    sec: "The Investment Question",
    q: "If I had fresh cash today and no prior position, would I buy this stock at the current price?",
    yesLabel: "No, I wouldn't",  noLabel: "Yes, I would",
    yesSell: true,
    sellNote: "If you wouldn't buy today, you have no investment reason to hold.",
    holdNote: "You'd still buy — that's a real conviction signal."
  },
  {
    sec: null,
    q: "Has the original reason I bought this stock changed significantly since I bought it?",
    yesLabel: "Yes, it has",  noLabel: "No, still intact",
    yesSell: true,
    sellNote: "A broken thesis is the clearest reason to exit.",
    holdNote: "The thesis is still intact — the holding is still logical."
  },
  {
    sec: "The Ego Question",
    q: "Am I holding primarily to avoid the feeling of admitting I was wrong?",
    yesLabel: "Honestly, yes",  noLabel: "No, it's the fundamentals",
    yesSell: true,
    sellNote: "This is the disposition effect. The market doesn't care about your entry price.",
    holdNote: "Good — you're holding on fundamentals, not feelings."
  },
  {
    sec: null,
    q: "Is my main reason for not selling that I'm waiting to 'get back to what I paid'?",
    yesLabel: "Yes, that's it",  noLabel: "No, that's not it",
    yesSell: true,
    sellNote: "Break-even is not an investment thesis. It's a psychological anchor.",
    holdNote: "Good — you're not anchored to your entry price."
  },
  {
    sec: "Opportunity Cost",
    q: "Is there another company where I have stronger conviction and better fundamentals right now?",
    yesLabel: "Yes, there is",  noLabel: "Not clearly",
    yesSell: true,
    sellNote: "Capital sitting in a weak position has an invisible cost.",
    holdNote: "No clearly better alternative — holding has lower opportunity cost."
  },
  {
    sec: null,
    q: "Can I clearly explain — without notes — what needs to be true for this thesis to work from here?",
    yesLabel: "No, I can't",  noLabel: "Yes, I can",
    yesSell: true,
    sellNote: "If you can't articulate the path forward, you don't have a thesis. You have a position.",
    holdNote: "You have a clear remaining thesis — that's what a hold decision should look like."
  }
];

const TIERS = [
  { min:5, label:"Strong sell signal",      color:"#b5350a", desc:"Multiple flags point the same direction. The ego question is likely driving this, not the investment case." },
  { min:3, label:"Review seriously",         color:"#B07A2B", desc:"Mixed signals — but enough sell signals that this deserves an honest conversation with yourself." },
  { min:1, label:"Mostly intact — but watch", color:"#2A6B38", desc:"A few things worth monitoring, but the core case appears to be holding." },
  { min:0, label:"Hold with conviction",    color:"#2A6B38", desc:"No sell signals. The investment question and the ego question are clearly separate here." }
];

let company = "";
let answers = new Array(6).fill(null); // true = sell signal, false = hold
let bottomBar = null;

const SCREEN  = document.querySelector('.screen');
const C       = document.getElementById('content');
const BADGE   = document.getElementById('badge');
const TOAST   = document.getElementById('toast');
let toastTimer = null;

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function sellCount(){ return answers.filter(a => a === true).length; }
function answered(){ return answers.filter(a => a !== null).length; }
function getTier(n){ return TIERS.find(t => n >= t.min); }

function toast(msg){
  TOAST.textContent = msg; TOAST.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => TOAST.classList.remove('show'), 1800);
}

function go(fn){
  C.classList.add('leaving');
  setTimeout(() => {
    C.innerHTML = ''; C.classList.remove('leaving'); C.classList.add('blank');
    setTimeout(() => { fn(); C.scrollTop = 0; C.classList.remove('blank'); }, 170);
  }, 210);
}

function setBottomBar(show, onclick){
  if(show && !bottomBar){
    bottomBar = document.createElement('div');
    bottomBar.className = 'btm';
    bottomBar.innerHTML = '<button class="btn" id="bb-btn">See the verdict →</button>';
    SCREEN.insertBefore(bottomBar, document.getElementById('toast'));
    bottomBar.querySelector('#bb-btn').onclick = onclick;
  } else if(!show && bottomBar){
    bottomBar.remove(); bottomBar = null;
  }
}

function intro(){
  setBottomBar(false);
  BADGE.classList.remove('show');
  const v = el(`<div>
    <div class="eyebrow">6-question honest check</div>
    <h1>Should I Sell This Stock?</h1>
    <p class="lead">There are two questions hiding inside every "should I sell" decision: the investment question and the ego question. This check separates them.</p>
    <div class="field">
      <label>Stock you're holding</label>
      <input id="co-in" type="text" placeholder="e.g. Sailun Group" autocomplete="off" spellcheck="false">
    </div>
    <div class="spacer"></div>
    <button class="btn" id="start" disabled>Start the check →</button>
    <a class="backlink" href="${ARTICLE_URL}" target="_blank" rel="noopener">← Read: The Two Stocks I Held Too Long</a>
  </div>`);
  C.innerHTML = ''; C.appendChild(v);
  const inp = v.querySelector('#co-in');
  const btn = v.querySelector('#start');
  if(company){ inp.value = company; btn.disabled = false; }
  inp.addEventListener('input', () => { company = inp.value.trim(); btn.disabled = !company; });
  inp.addEventListener('keydown', e => { if(e.key === 'Enter' && company) go(checklist); });
  btn.onclick = () => { if(company) go(checklist); };
  setTimeout(() => inp.focus(), 320);
}

function checklist(){
  answers = new Array(6).fill(null);
  BADGE.textContent = '0 / 6'; BADGE.classList.add('show');

  const rows = QUESTIONS.map((q, i) => {
    const secHtml = q.sec ? `<div class="sec">${q.sec}</div>` : '';
    return `${secHtml}<div class="qrow" data-i="${i}">
      <div class="qtext">${q.q}</div>
      <div class="toggle-row">
        <button class="tog yes" data-i="${i}" data-v="true">${q.yesLabel}</button>
        <button class="tog no"  data-i="${i}" data-v="false">${q.noLabel}</button>
      </div>
    </div>`;
  }).join('');

  const v = el(`<div>
    <div class="eyebrow">${company}</div>
    <h2>Answer honestly — no one's watching</h2>
    <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
    ${rows}
  </div>`);
  C.innerHTML = ''; C.appendChild(v);

  const pbar = v.querySelector('#pbar');

  const syncUI = () => {
    const n = answered();
    BADGE.textContent = n + ' / 6';
    pbar.style.width = (n / 6 * 100) + '%';
    v.querySelectorAll('.tog').forEach(btn => {
      const i = +btn.dataset.i, isSell = btn.dataset.v === 'true';
      btn.classList.remove('sel');
      if(answers[i] !== null && answers[i] === isSell) btn.classList.add('sel');
    });
  };

  v.querySelectorAll('.tog').forEach(btn => {
    btn.addEventListener('click', () => {
      answers[+btn.dataset.i] = btn.dataset.v === 'true';
      syncUI();
    });
  });

  setBottomBar(true, () => go(results));
  syncUI();
}

function results(){
  setBottomBar(false);
  BADGE.classList.remove('show');
  const n = sellCount();
  const tier = getTier(n);

  /* find key flags */
  const keyFlags = answers.map((a, i) => ({ q: QUESTIONS[i], sell: a }))
    .filter(x => x.sell)
    .map(x => `<div class="key-flag">
      <div class="kf-label">Sell signal</div>
      <div class="kf-text">${x.q.sellNote}</div>
    </div>`).join('');

  const summary = QUESTIONS.map((q, i) => {
    const sell = answers[i];
    return `<div class="qs-row">
      <span class="qs-pill ${sell ? 'sell' : 'hold'}">${sell ? 'SELL' : 'HOLD'}</span>
      <span class="qs-text">${q.q}</span>
    </div>`;
  }).join('');

  const v = el(`<div>
    <div class="eyebrow">${company}</div>
    <div class="score-row">
      <span class="score-num" style="color:${tier.color}">${n}</span>
      <span class="score-den">/ 6 sell signals</span>
    </div>
    <div class="tier-name" style="color:${tier.color}">${tier.label}</div>
    <div class="tier-note">${tier.desc}</div>
    ${keyFlags}
    <div class="q-summary">${summary}</div>
    <div class="sharehead">Share this result</div>
    <div class="sharegrid">
      <button class="share s-x"  data-p="x">𝕏 Post</button>
      <button class="share s-wa" data-p="whatsapp">WhatsApp</button>
      <button class="share s-tg" data-p="telegram">Telegram</button>
      <button class="share s-cp" data-p="copy">Copy link</button>
    </div>
    <button class="btn" id="retry">Check another stock</button>
    <button class="btn ghost" id="redo">← Re-check ${company}</button>
    <a class="backlink" href="${ARTICLE_URL}" target="_blank" rel="noopener">← Read: The Two Stocks I Held Too Long</a>
    <a class="backlink" href="https://ordinarymantrying.com/tools/investment-punch-card.html">Decided to sell? → Remove it from your Punch Card</a>
    <a class="backlink" href="https://ordinarymantrying.com/tools/investor-bias-check.html">Not sure? → Check if you're in love with this stock first</a>
  </div>`);
  C.innerHTML = ''; C.appendChild(v);
  v.querySelectorAll('.share').forEach(b => b.onclick = () => doShare(b.dataset.p, n));
  v.querySelector('#retry').onclick = () => { company = ''; answers = new Array(6).fill(null); go(intro); };
  v.querySelector('#redo').onclick  = () => go(checklist);
}

function doShare(platform, n){
  const tier = getTier(n);
  const text = `I ran "${company}" through the Should I Sell? checklist — got ${n}/6 sell signals (${tier.label}). Is it the investment case or the ego talking?`;
  const url  = TOOL_URL;
  const t = encodeURIComponent(text), u = encodeURIComponent(url);
  if(platform === 'copy'){
    const pay = text + ' ' + url;
    const fallback = () => {
      try{ const ta=document.createElement('textarea'); ta.value=pay; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Copied!'); }
      catch{ toast('Could not copy'); }
    };
    if(navigator.clipboard?.writeText) navigator.clipboard.writeText(pay).then(()=>toast('Copied!'), fallback);
    else fallback();
    return;
  }
  let link = '';
  switch(platform){
    case 'x':        link = `https://twitter.com/intent/tweet?text=${t}&url=${u}`; break;
    case 'whatsapp': link = `https://wa.me/?text=${encodeURIComponent(text+' '+url)}`; break;
    case 'telegram': link = `https://t.me/share/url?url=${u}&text=${t}`; break;
  }
  if(link) window.open(link, '_blank', 'noopener');
}

intro();
</script>
</body>

<style>
  :root{
    --bg-1:#091509; --bg-2:#152219;
    --device:#080e09; --bezel:#040804;
    --screen:#F7FAF5; --ink:#1a2118; --muted:#5a7060;
    --line:#cfdecb;
    --accent:#2A6B38; --accent-soft:#e6f4e9; --accent-ink:#fff;
    --gold:#8B6914; --gold-soft:#fdf5e0;
    --warn:#B07A2B; --warn-soft:#fef3e2;
    --bad:#b5350a; --bad-soft:#fdf0ec;
    --tile:#fff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--ink);
    background:radial-gradient(120% 120% at 50% 0%,var(--bg-2),var(--bg-1));
    display:flex; align-items:center; justify-content:center; padding:20px; min-height:100%;
  }
  .phone{
    width:370px; max-width:100%; height:760px; max-height:94vh;
    background:linear-gradient(160deg,#0e1a0f,var(--device));
    border-radius:46px; padding:13px;
    box-shadow:0 2px 0 #1e2e20 inset,0 40px 80px -30px #000,0 0 0 2px var(--bezel);
    position:relative; display:flex; flex-direction:column;
  }
  .notch{
    position:absolute; top:13px; left:50%; transform:translateX(-50%);
    width:138px; height:26px; background:var(--bezel); border-radius:0 0 18px 18px; z-index:5;
  }
  .screen{
    flex:1; background:var(--screen); border-radius:34px;
    overflow:hidden; display:flex; flex-direction:column; position:relative;
  }

  /* status bar */
  .statusbar{
    flex:0 0 auto; padding:14px 22px 8px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .badge{
    font-family:var(--mono); font-size:12px; font-weight:700;
    color:var(--accent); background:var(--accent-soft);
    padding:4px 10px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .badge.show{opacity:1}

  /* scrollable content */
  .content{
    flex:1 1 0; overflow-y:auto; padding:6px 22px 18px;
    display:flex; flex-direction:column;
    transition:opacity .24s ease,transform .24s ease;
    -webkit-overflow-scrolling:touch;
  }
  .content.leaving{opacity:0; transform:translateY(6px)}
  .content.blank{opacity:0}

  /* bottom bar (checklist only) */
  .btm{
    flex:0 0 auto; padding:10px 22px 18px;
    background:var(--screen); border-top:1px solid var(--line);
  }

  /* typography */
  .eyebrow{
    font-size:11px; letter-spacing:.15em; text-transform:uppercase;
    color:var(--accent); font-weight:800; margin-bottom:12px;
  }
  h1{font-size:26px; line-height:1.2; font-weight:800; letter-spacing:-.02em; margin-bottom:10px}
  h2{font-size:19px; line-height:1.25; font-weight:800; margin-bottom:4px}
  .lead{font-size:14px; line-height:1.55; color:var(--muted); margin-bottom:18px}
  .spacer{flex:1 1 auto; min-height:10px}

  /* buttons */
  .btn{
    appearance:none; border:none; cursor:pointer; width:100%;
    font-family:var(--sans); font-size:15px; font-weight:700; padding:14px;
    border-radius:14px; background:var(--accent); color:var(--accent-ink);
    transition:transform .08s,filter .12s; margin-bottom:8px; display:block;
  }
  .btn:active{transform:scale(.985)} .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent; color:var(--muted); font-size:13px; font-weight:600; padding:10px}
  .btn:disabled{opacity:.35; cursor:not-allowed}
  .btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

  /* company input */
  .field{margin-bottom:20px}
  .field label{
    display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); font-weight:700; margin-bottom:7px;
  }
  .field input{
    width:100%; font-size:20px; font-weight:700; color:var(--ink);
    background:var(--tile); border:1.5px solid var(--line);
    border-radius:12px; padding:11px 13px; outline:none;
    font-family:var(--sans); transition:border-color .15s;
  }
  .field input:focus{border-color:var(--accent)}
  .field input::placeholder{color:#b8d0b4; font-weight:400}

  /* progress bar */
  .pbar-wrap{height:3px; background:var(--line); border-radius:99px; margin-bottom:14px}
  .pbar{height:100%; width:0%; background:var(--accent); border-radius:99px; transition:width .3s}

  /* section label */
  .sec{
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    font-weight:800; color:var(--accent); margin-top:14px; margin-bottom:6px;
    padding-bottom:5px; border-bottom:1px solid var(--line);
  }

  /* checklist items */
  .ci{
    display:flex; gap:11px; align-items:flex-start;
    padding:9px 0; border-bottom:1px solid var(--line);
    cursor:pointer; user-select:none; -webkit-user-select:none;
  }
  .ci:last-child{border-bottom:none}
  .ci-box{
    flex:0 0 20px; width:20px; height:20px;
    border:2px solid var(--line); border-radius:5px;
    margin-top:1px; display:flex; align-items:center; justify-content:center;
    background:var(--tile); transition:background .12s,border-color .12s;
  }
  .ci.on .ci-box{background:var(--accent); border-color:var(--accent)}
  .ci.on .ci-box::after{content:"✓"; color:#fff; font-size:11px; font-weight:900; line-height:1}
  .ci-text{font-size:13.5px; line-height:1.45; color:var(--ink); transition:color .12s}
  .ci.on .ci-text{color:var(--accent)}

  /* results: score */
  .score-row{display:flex; align-items:baseline; gap:6px; margin:2px 0 4px}
  .score-num{font-family:var(--mono); font-size:64px; font-weight:800; line-height:1}
  .score-den{font-size:22px; font-weight:700; color:var(--muted)}
  .tier-name{font-size:15px; font-weight:800; margin-bottom:3px}
  .tier-note{font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:14px}

  /* results: item grid */
  .ri-grid{display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:16px}
  .ri{
    display:flex; align-items:center; gap:5px;
    padding:6px 8px; border-radius:8px; min-width:0;
  }
  .ri.pass{background:var(--accent-soft)}
  .ri.fail{background:var(--bad-soft)}
  .ri-icon{font-size:11px; font-weight:900; flex:0 0 12px}
  .ri.pass .ri-icon{color:var(--accent)} .ri.fail .ri-icon{color:var(--bad)}
  .ri-name{
    font-size:11px; font-weight:700; line-height:1.3;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  .ri.pass .ri-name{color:var(--accent)} .ri.fail .ri-name{color:var(--bad)}

  /* share */
  .sharehead{
    font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    font-weight:800; color:var(--muted); margin:14px 0 8px; text-align:center;
  }
  .sharegrid{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:10px}
  .share{
    appearance:none; border:none; cursor:pointer; color:#fff;
    font-family:var(--sans); font-size:13px; font-weight:700;
    padding:11px 8px; border-radius:11px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .08s,filter .12s;
  }
  .share:active{transform:scale(.97)} .share:hover{filter:brightness(1.08)}
  .s-x{background:#000} .s-wa{background:#25D366}
  .s-tg{background:#229ED9} .s-cp{background:#3a4850}

  /* backlink */
  .backlink{
    display:block; text-align:center; font-size:12px; color:var(--muted);
    text-decoration:none; padding:8px 0; margin-top:2px;
  }
  .backlink:hover{color:var(--accent)}

  /* toast */
  .toast{
    position:absolute; left:50%; bottom:24px;
    transform:translateX(-50%) translateY(18px);
    background:var(--ink); color:#fff; font-size:13px; font-weight:600;
    padding:10px 16px; border-radius:999px;
    opacity:0; pointer-events:none; white-space:nowrap;
    transition:opacity .22s,transform .22s; z-index:30;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){
    .content,.btn,.ci-box,.ci-text,.pbar,.share{transition:none}
  }
</style>

<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="statusbar">
      <span class="brand">10× Screen</span>
      <span class="badge" id="badge">0 / 12</span>
    </div>
    <div class="content" id="content"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
const TOOL_URL    = "https://ordinarymantrying.com/tools/10x-stock-screener.html";
const ARTICLE_URL = "https://ordinarymantrying.com/what-makes-a-stock-a-10x-candidate-i-asked-ai-to-help-me-build-a-filter/";

const CRITERIA = [
  { section: "Scalability", items: [
    { key: "Replicable model",     text: "The business model can be copied to new markets or product lines without falling apart" },
    { key: "Capital-light growth", text: "Scaling doesn't require proportional increases in capital or scarce raw materials" },
    { key: "Abundant inputs",      text: "The core input or resource is widely available — no single supply bottleneck" }
  ]},
  { section: "Pricing Power & Moat", items: [
    { key: "Pricing power",  text: "Customers would not switch if the company raised prices by 5–10%" },
    { key: "Clear moat",     text: "There's an identifiable moat: brand loyalty, switching costs, network effects, or cost advantage" },
    { key: "Stable margins", text: "Gross margin has been stable or improving over the past 3 years" }
  ]},
  { section: "Growth Runway", items: [
    { key: "Low penetration",   text: "Market share is below 30% — meaningful room left to grow" },
    { key: "Industry tailwind", text: "The broader industry is growing faster than GDP" },
    { key: "Global potential",  text: "International expansion is already underway or clearly achievable" }
  ]},
  { section: "Financial Discipline", items: [
    { key: "Positive FCF",         text: "Free cash flow is consistently positive and growing year over year" },
    { key: "Aligned management",   text: "Management holds meaningful equity — their money is in the same boat as yours" },
    { key: "Recession resilience", text: "Revenue maintained or grew through the last major economic downturn" }
  ]}
];

const TIERS = [
  { min:10, label:"Rare — 10× profile",   color:"#8B6914",
    desc:"This profile is genuinely uncommon. Worth serious, deep research." },
  { min:7,  label:"Promising candidate",  color:"#2A6B38",
    desc:"Strong fundamentals. The unchecked boxes deserve careful investigation before you commit." },
  { min:4,  label:"Mixed signals",        color:"#B07A2B",
    desc:"Some moat present, but durability is unclear. Don't size up before you know why boxes are empty." },
  { min:0,  label:"Fails the filter",     color:"#b5350a",
    desc:"Too many fundamentals missing. Most 10× stocks don't look like this at any point in their history." }
];

const ALL_ITEMS = CRITERIA.flatMap(s => s.items);

/* ── state ── */
let company = "";
let checked = [];
let bottomBar = null;

const SCREEN  = document.querySelector('.screen');
const C       = document.getElementById('content');
const BADGE   = document.getElementById('badge');
const TOAST   = document.getElementById('toast');
let toastTimer = null;

/* ── helpers ── */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function score(){ return checked.filter(Boolean).length; }
function getTier(n){ return TIERS.find(t => n >= t.min); }

function toast(msg){
  TOAST.textContent = msg; TOAST.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => TOAST.classList.remove('show'), 1800);
}

function go(fn){
  C.classList.add('leaving');
  setTimeout(() => {
    C.innerHTML = ''; C.classList.remove('leaving'); C.classList.add('blank');
    setTimeout(() => { fn(); C.scrollTop = 0; C.classList.remove('blank'); }, 170);
  }, 210);
}

function setBottomBar(show, onclick){
  if(show && !bottomBar){
    bottomBar = document.createElement('div');
    bottomBar.className = 'btm';
    bottomBar.innerHTML = '<button class="btn" id="bb-btn">See the score →</button>';
    SCREEN.insertBefore(bottomBar, document.getElementById('toast'));
    bottomBar.querySelector('#bb-btn').onclick = onclick;
  } else if(!show && bottomBar){
    bottomBar.remove(); bottomBar = null;
  }
}

/* ── screens ── */
function intro(){
  setBottomBar(false);
  BADGE.classList.remove('show');

  const v = el(`<div>
    <div class="eyebrow">12-point filter</div>
    <h1>Does This Company Have What It Takes to 10×?</h1>
    <p class="lead">Pick a company you're researching. Check every criterion it meets. Find out if its fundamentals match the profile that creates decade-long wealth — or where the gaps are.</p>
    <div class="field">
      <label>Company name</label>
      <input id="co-in" type="text" placeholder="e.g. Kweichow Moutai" autocomplete="off" spellcheck="false">
    </div>
    <div class="spacer"></div>
    <button class="btn" id="start" disabled>Start the screen →</button>
    <style>.nxt-link{display:block;text-align:center;font-size:13px;color:var(--muted,#6b7a8f);text-decoration:none;padding:20px 0 8px;letter-spacing:.01em;transition:color .2s}.nxt-link:hover{color:var(--accent,#f59e0b)}</style>
<a class="nxt-link" href="${ARTICLE_URL}" target="_blank" rel="noopener">← What makes a 10× stock? Read the post</a>
  </div>`);
  C.innerHTML = ''; C.appendChild(v);

  const inp = v.querySelector('#co-in');
  const btn = v.querySelector('#start');
  if(company){ inp.value = company; btn.disabled = false; }

  inp.addEventListener('input', () => { company = inp.value.trim(); btn.disabled = !company; });
  inp.addEventListener('keydown', e => { if(e.key === 'Enter' && company) go(checklist); });
  btn.onclick = () => { if(company) go(checklist); };
  setTimeout(() => inp.focus(), 320);
}

function checklist(){
  checked = new Array(12).fill(false);
  BADGE.textContent = '0 / 12'; BADGE.classList.add('show');

  let idx = 0;
  const sections = CRITERIA.map(sec => {
    const rows = sec.items.map(item => {
      const i = idx++;
      return `<div class="ci" data-i="${i}">
        <div class="ci-box"></div>
        <div class="ci-text">${item.text}</div>
      </div>`;
    }).join('');
    return `<div class="sec">${sec.section}</div>${rows}`;
  }).join('');

  const v = el(`<div>
    <div class="eyebrow">${company}</div>
    <h2>Check every criterion that applies</h2>
    <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
    ${sections}
  </div>`);
  C.innerHTML = ''; C.appendChild(v);

  const pbar = v.querySelector('#pbar');

  const syncUI = () => {
    const n = score();
    BADGE.textContent = n + ' / 12';
    pbar.style.width = (n / 12 * 100) + '%';
    v.querySelectorAll('.ci').forEach((row, i) => row.classList.toggle('on', checked[i]));
  };

  v.querySelectorAll('.ci').forEach(row => {
    row.addEventListener('click', () => {
      checked[+row.dataset.i] = !checked[+row.dataset.i];
      syncUI();
    });
  });

  setBottomBar(true, () => go(results));
  syncUI();
}

function results(){
  setBottomBar(false);
  BADGE.classList.remove('show');

  const n = score();
  const tier = getTier(n);

  const riGrid = ALL_ITEMS.map((item, i) => {
    const p = checked[i];
    return `<div class="ri ${p ? 'pass' : 'fail'}">
      <span class="ri-icon">${p ? '✓' : '✗'}</span>
      <span class="ri-name">${item.key}</span>
    </div>`;
  }).join('');

  const v = el(`<div>
    <div class="eyebrow">${company}</div>
    <div class="score-row">
      <span class="score-num" style="color:${tier.color}">${n}</span>
      <span class="score-den">/ 12</span>
    </div>
    <div class="tier-name" style="color:${tier.color}">${tier.label}</div>
    <div class="tier-note">${tier.desc}</div>
    <div class="ri-grid">${riGrid}</div>
    <div class="sharehead">Share this result</div>
    <div class="sharegrid">
      <button class="share s-x"  data-p="x">𝕏 Post</button>
      <button class="share s-wa" data-p="whatsapp">WhatsApp</button>
      <button class="share s-tg" data-p="telegram">Telegram</button>
      <button class="share s-cp" data-p="copy">Copy link</button>
    </div>
    <button class="btn" id="retry">Screen another company</button>
    <button class="btn ghost" id="redo">← Re-check ${company}</button>
    <a class="backlink" href="https://ordinarymantrying.com/tools/value-investing-calculator.html">Passes the screen? → Full Buffett Analysis</a>
    <a class="backlink" href="https://ordinarymantrying.com/tools/investor-bias-check.html">Already own it? → Check Your Investor Bias</a>
    <a class="backlink" href="${ARTICLE_URL}" target="_blank" rel="noopener">← Read: What Makes a 10× Stock?</a>
  </div>`);
  C.innerHTML = ''; C.appendChild(v);

  v.querySelectorAll('.share').forEach(b => b.onclick = () => doShare(b.dataset.p, n));
  v.querySelector('#retry').onclick = () => { company = ''; checked = []; go(intro); };
  v.querySelector('#redo').onclick  = () => go(checklist);
}

/* ── share ── */
function doShare(platform, n){
  const tier = getTier(n);
  const text = `I screened ${company} against 12 value-investing criteria — scored ${n}/12 (${tier.label}). Does it have 10× potential?`;
  const url  = TOOL_URL;
  const t = encodeURIComponent(text), u = encodeURIComponent(url);

  if(platform === 'copy'){
    const pay = text + ' ' + url;
    const fallback = () => {
      try{
        const ta = document.createElement('textarea');
        ta.value = pay; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove(); toast('Copied!');
      } catch{ toast('Could not copy'); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(pay).then(() => toast('Copied!'), fallback);
    } else { fallback(); }
    return;
  }
  let link = '';
  switch(platform){
    case 'x':        link = `https://twitter.com/intent/tweet?text=${t}&url=${u}`; break;
    case 'whatsapp': link = `https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}`; break;
    case 'telegram': link = `https://t.me/share/url?url=${u}&text=${t}`; break;
  }
  if(link) window.open(link, '_blank', 'noopener');
}

/* ── boot ── */
intro();
</script>
<a class="nxt-link" href="https://ordinarymantrying.com/tools/value-investing-calculator.html">Next → Passes the screen? Full Buffett Analysis</a>
</body>

<title>Home Inventory Manager</title>
<style>
:root{
  --paper:#FAFAF7; --ink:#1F2937; --ink-soft:#6B7280; --line:#E5E2DA;
  --teal:#0F766E; --teal-soft:#E6F2F0; --amber:#B45309; --amber-soft:#FCF3E3;
  --red:#B91C1C; --red-soft:#FBEAEA; --card:#FFFFFF;
  --mono:"SF Mono",Consolas,"Cascadia Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.6}
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
header h1 span{color:var(--teal)}
#search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;background:var(--card);outline:none}
#search:focus{border-color:var(--teal)}
nav{display:flex;gap:4px;background:var(--paper);border-bottom:1px solid var(--line);padding:0 20px;overflow-x:auto}
nav button{border:none;background:none;padding:10px 14px;font-size:14px;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
nav button .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px;vertical-align:1px}
main{max-width:880px;margin:0 auto;padding:20px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.toolbar h2{font-size:16px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:3px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.item-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.item-name{font-weight:600;font-size:15px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;margin-left:6px;vertical-align:1px}
.tag.consumable{background:var(--teal-soft);color:var(--teal)}
.tag.asset{background:#EEF0F4;color:#4B5563}
.loc{font-size:13px;color:var(--ink-soft);margin-top:2px}
.loc b{color:var(--ink);font-weight:500}
.loc .sep{margin:0 4px;color:#C7C2B6}
.stock{text-align:right;min-width:120px}
.stock .qty{font-family:var(--mono);font-size:17px;font-weight:600}
.stock .unit{font-size:12px;color:var(--ink-soft);margin-left:2px}
.status{font-size:12px;margin-top:2px;padding:1px 8px;border-radius:6px;display:inline-block}
.status.ok{background:var(--teal-soft);color:var(--teal)}
.status.low{background:var(--amber-soft);color:var(--amber)}
.status.out{background:var(--red-soft);color:var(--red)}
.bar{height:5px;border-radius:3px;background:#EFECE4;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--teal)}
.bar i.low{background:var(--amber)}.bar i.out{background:var(--red)}
.row-actions{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:13px;color:var(--ink-soft);margin-top:4px}
.empty{text-align:center;color:var(--ink-soft);padding:50px 20px;font-size:14px}
.group-title{font-size:13px;color:var(--ink-soft);letter-spacing:.1em;margin:18px 0 8px;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--ink-soft);font-weight:500}
td.num{font-family:var(--mono)}
.modal-mask{position:fixed;inset:0;background:rgba(31,41,55,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 16px;overflow:auto}
.modal-mask.open{display:flex}
.modal{background:var(--card);border-radius:12px;padding:22px;width:100%;max-width:460px}
.modal h3{font-size:16px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal)}
.field-row{display:flex;gap:10px}.field-row .field{flex:1}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.hint{font-size:12px;color:var(--ink-soft);margin-top:3px}
.hint a{color:var(--teal);cursor:pointer;text-decoration:underline}
.alert-strip{background:var(--amber-soft);border:1px solid #EAD9B8;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:14px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
textarea{resize:vertical}
@media(max-width:560px){.stock{min-width:auto}}

<body>

<header>
  <h1>Home <span>Inventory</span></h1>
  <input id="search" type="search" placeholder="Search items, locations, notes...  e.g. batteries, closet">
  <button class="btn primary" onclick="openItemModal()">＋ Add Item</button>
</header>

<nav>
  <button data-tab="overview" class="active" onclick="switchTab('overview')">Overview<span class="badge" id="alertBadge" style="display:none"></span></button>
  <button data-tab="items" onclick="switchTab('items')">All Items</button>
  <button data-tab="locations" onclick="switchTab('locations')">By Location</button>
  <button data-tab="purchases" onclick="switchTab('purchases')">Purchase Log</button>
  <button data-tab="data" onclick="switchTab('data')">Backup</button>
</nav>

<main>
  <section id="tab-overview"></section>
  <section id="tab-items" style="display:none"></section>
  <section id="tab-locations" style="display:none"></section>
  <section id="tab-purchases" style="display:none"></section>
  <section id="tab-data" style="display:none">
    <div class="toolbar"><h2>Backup & Restore</h2></div>
    <div class="card">
      <p style="font-size:14px;margin-bottom:10px">All data is stored as JSON. Export regularly for backup — importing will overwrite all current data.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" onclick="exportData()">Export JSON Backup</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">Import JSON</button>
        <button class="btn danger" onclick="clearAll()">Clear All Data</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
      <p class="hint" style="margin-top:12px" id="dataStats"></p>
    </div>
  </section>
</main>

<!-- Add/Edit Item Modal -->
<div class="modal-mask" id="itemModal">
  <div class="modal">
    <h3 id="itemModalTitle">Add Item</h3>
    <input type="hidden" id="f_id">
    <div class="field"><label>Name *</label><input id="f_name" placeholder="e.g. AA batteries / vacuum cleaner"></div>
    <div class="field-row">
      <div class="field"><label>Type</label>
        <select id="f_category" onchange="toggleConsumableFields()">
          <option value="consumable">Consumable (used up, needs restocking)</option>
          <option value="asset">Asset (long-term use)</option>
        </select>
      </div>
      <div class="field"><label>Unit</label><input id="f_unit" placeholder="pcs / rolls / bottles" value="pcs"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Room *</label><input id="f_room" list="roomList" placeholder="Living room / Kitchen / Storage"></div>
      <div class="field"><label>Specific Location</label><input id="f_spot" placeholder="Bottom shelf / Left cabinet"></div>
    </div>
    <datalist id="roomList"></datalist>
    <div class="field-row">
      <div class="field"><label>Current Quantity</label><input id="f_qty" type="number" min="0" step="any" value="1"></div>
      <div class="field" data-consumable><label>Daily Usage Rate</label><input id="f_dailyUse" type="number" min="0" step="any" placeholder="0.1">
        <p class="hint" id="estimateHint"></p>
      </div>
    </div>
    <div class="field" data-consumable><label>Alert Threshold (days remaining ≤ this value)</label><input id="f_alertDays" type="number" min="1" value="10"></div>
    <div class="field"><label>Notes</label><textarea id="f_note" rows="2" placeholder="Brand, model, warranty expiry, etc."></textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('itemModal')">Cancel</button>
      <button class="btn primary" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<!-- Purchase Log Modal -->
<div class="modal-mask" id="purchaseModal">
  <div class="modal">
    <h3>Log a Purchase</h3>
    <input type="hidden" id="p_itemId">
    <div class="field"><label>Item</label><select id="p_itemSelect"></select></div>
    <div class="field-row">
      <div class="field"><label>Purchase Date</label><input id="p_date" type="date"></div>
      <div class="field"><label>Quantity *</label><input id="p_qty" type="number" min="0" step="any" value="1"></div>
    </div>
    <div class="field"><label>Total Price (optional)</label><input id="p_price" type="number" min="0" step="any" placeholder="0.00"></div>
    <div class="field"><label>Notes</label><input id="p_note" placeholder="Store, promo details, etc."></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('purchaseModal')">Cancel</button>
      <button class="btn primary" onclick="savePurchase()">Save & Add to Stock</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const KEY='home-inventory-v1';
let state={items:[],purchases:[]};
let currentTab='overview';

/* ---------- Storage ---------- */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){}
  render();
}
let saveTimer=null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ toast('Save failed. Please export a backup.'); }
  },300);
}

/* ---------- Utilities ---------- */
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>{const v=Math.round(n*100)/100;return v.toString();};
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------- Consumption Model ---------- */
function itemStatus(it){
  if(it.category!=='consumable')return null;
  const rate=parseFloat(it.dailyUse)||0;
  const alertDays=parseFloat(it.alertDays)||10;
  if(it.qty<=0)return{level:'out',text:'Out of stock',days:0};
  if(rate<=0)return{level:'ok',text:'No usage rate set',days:null};
  const days=it.qty/rate;
  if(days<=alertDays)return{level: days<=alertDays/2?'out':'low',text:`Runs out in ~${Math.floor(days)} days`,days};
  return{level:'ok',text:`~${Math.floor(days)} days remaining`,days};
}
function estimateRate(itemId){
  const ps=state.purchases.filter(p=>p.itemId===itemId).sort((a,b)=>a.date<b.date?-1:1);
  if(ps.length<2)return null;
  const first=new Date(ps[0].date),last=new Date(ps[ps.length-1].date);
  const span=(last-first)/86400000;
  if(span<=0)return null;
  const consumed=ps.slice(0,-1).reduce((s,p)=>s+(parseFloat(p.qty)||0),0);
  return consumed/span;
}

/* ---------- Render ---------- */
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  ['overview','items','locations','purchases','data'].forEach(t=>$('tab-'+t).style.display=t===tab?'':'none');
  render();
}
function matchSearch(it,q){
  if(!q)return true;
  return [it.name,it.room,it.spot,it.note].some(f=>(f||'').toLowerCase().includes(q));
}
function render(){
  const q=$('search').value.trim().toLowerCase();
  renderBadge();
  if(currentTab==='overview')renderOverview(q);
  if(currentTab==='items')renderItems(q);
  if(currentTab==='locations')renderLocations(q);
  if(currentTab==='purchases')renderPurchases(q);
  if(currentTab==='data')renderDataStats();
}
function renderBadge(){
  const n=state.items.filter(it=>{const s=itemStatus(it);return s&&(s.level==='low'||s.level==='out');}).length;
  const b=$('alertBadge');
  b.style.display=n?'inline-block':'none';b.textContent=n;
}
function itemCard(it){
  const s=itemStatus(it);
  let stockHtml='';
  if(it.category==='consumable'){
    const alertDays=parseFloat(it.alertDays)||10;
    let pct=100;
    if(s.days!==null){pct=Math.max(0,Math.min(100,(s.days/(alertDays*3))*100));}
    stockHtml=`<div class="stock">
      <div><span class="qty">${fmt(it.qty)}</span><span class="unit">${esc(it.unit)}</span></div>
      <span class="status ${s.level}">${s.text}</span>
      <div class="bar" style="width:120px;margin-left:auto"><i class="${s.level}" style="width:${pct}%"></i></div>
    </div>`;
  }else{
    stockHtml=`<div class="stock"><div><span class="qty">${fmt(it.qty)}</span><span class="unit">${esc(it.unit)}</span></div></div>`;
  }
  return `<div class="card">
    <div class="item-row">
      <div style="flex:1;min-width:200px">
        <div class="item-name">${esc(it.name)}<span class="tag ${it.category==='consumable'?'consumable':'asset'}">${it.category==='consumable'?'Consumable':'Asset'}</span></div>
        <div class="loc">📍 <b>${esc(it.room)||'No room'}</b>${it.spot?`<span class="sep">›</span>${esc(it.spot)}`:''}</div>
        ${it.note?`<div class="note">${esc(it.note)}</div>`:''}
        <div class="row-actions">
          ${it.category==='consumable'?`<button class="btn sm" onclick="adjustQty('${it.id}',-1)">−1 Used</button>`:''}
          <button class="btn sm" onclick="openPurchaseModal('${it.id}')">Log Purchase</button>
          <button class="btn sm" onclick="openItemModal('${it.id}')">Edit</button>
          <button class="btn sm danger" onclick="deleteItem('${it.id}')">Delete</button>
        </div>
      </div>
      ${stockHtml}
    </div>
  </div>`;
}
function renderOverview(q){
  const el=$('tab-overview');
  const alerts=state.items.filter(it=>{const s=itemStatus(it);return s&&(s.level==='low'||s.level==='out')&&matchSearch(it,q);});
  const totalAssets=state.items.filter(i=>i.category==='asset').length;
  const totalCons=state.items.filter(i=>i.category==='consumable').length;
  const spent=state.purchases.reduce((s,p)=>s+(parseFloat(p.price)||0),0);
  let html=`<div class="toolbar"><h2>Home Status</h2></div>
  <div class="card" style="display:flex;gap:28px;flex-wrap:wrap;font-size:14px">
    <div>Consumables <b style="font-size:20px;font-family:var(--mono)">${totalCons}</b> types</div>
    <div>Assets <b style="font-size:20px;font-family:var(--mono)">${totalAssets}</b> items</div>
    <div>Purchase logs <b style="font-size:20px;font-family:var(--mono)">${state.purchases.length}</b></div>
    <div>Total spent <b style="font-size:20px;font-family:var(--mono)">¥${fmt(spent)}</b></div>
  </div>`;
  if(alerts.length){
    html+=`<div class="alert-strip">⚠️ <b>${alerts.length}</b> consumable(s) running low — check before your next shopping trip:</div>`;
    html+=alerts.map(itemCard).join('');
  }else{
    html+=`<div class="empty">✅ No consumables need restocking${state.items.length===0?'. Click "+ Add Item" to get started':''}</div>`;
  }
  el.innerHTML=html;
}
function renderItems(q){
  const el=$('tab-items');
  let list=state.items.filter(it=>matchSearch(it,q));
  list.sort((a,b)=>{
    const sa=itemStatus(a),sb=itemStatus(b);
    const rank=s=>!s?3:s.level==='out'?0:s.level==='low'?1:2;
    return rank(sa)-rank(sb)||a.name.localeCompare(b.name);
  });
  let html=`<div class="toolbar"><h2>All Items (${list.length})</h2></div>`;
  html+=list.length?list.map(itemCard).join(''):`<div class="empty">${q?'No matching items':'No items yet. Click "+ Add Item" to start.'}</div>`;
  el.innerHTML=html;
}
function renderLocations(q){
  const el=$('tab-locations');
  const list=state.items.filter(it=>matchSearch(it,q));
  const groups={};
  list.forEach(it=>{const r=it.room||'Uncategorized';(groups[r]=groups[r]||[]).push(it);});
  let html=`<div class="toolbar"><h2>Browse by Location</h2></div>`;
  const rooms=Object.keys(groups).sort();
  if(!rooms.length)html+=`<div class="empty">No items yet.</div>`;
  rooms.forEach(r=>{
    html+=`<div class="group-title">🏠 ${esc(r)} (${groups[r].length})</div>`;
    html+=groups[r].map(itemCard).join('');
  });
  el.innerHTML=html;
}
function renderPurchases(q){
  const el=$('tab-purchases');
  const nameOf=id=>{const it=state.items.find(i=>i.id===id);return it?it.name:'(deleted item)';};
  let list=state.purchases.filter(p=>!q||nameOf(p.itemId).toLowerCase().includes(q)||(p.note||'').toLowerCase().includes(q));
  list.sort((a,b)=>a.date<b.date?1:-1);
  let html=`<div class="toolbar"><h2>Purchase Log (${list.length})</h2><button class="btn primary" onclick="openPurchaseModal()">＋ Log Purchase</button></div>`;
  if(!list.length){html+=`<div class="empty">No purchase records yet. Log your purchases to track spending and auto-estimate usage rates.</div>`;el.innerHTML=html;return;}
  html+=`<div class="card" style="padding:4px 8px;overflow-x:auto"><table>
    <tr><th>Date</th><th>Item</th><th>Qty</th><th>Amount</th><th>Notes</th><th></th></tr>`;
  list.forEach(p=>{
    html+=`<tr>
      <td class="num">${p.date}</td><td>${esc(nameOf(p.itemId))}</td>
      <td class="num">${fmt(p.qty)}</td><td class="num">${p.price?'¥'+fmt(p.price):'—'}</td>
      <td style="color:var(--ink-soft);font-size:13px">${esc(p.note)||''}</td>
      <td><button class="btn sm danger" onclick="deletePurchase('${p.id}')">Del</button></td>
    </tr>`;
  });
  html+=`</table></div>`;
  el.innerHTML=html;
}
function renderDataStats(){
  $('dataStats').textContent=`Currently ${state.items.length} items and ${state.purchases.length} purchase records.`;
}

/* ---------- Item CRUD ---------- */
function openItemModal(id){
  const it=id?state.items.find(i=>i.id===id):null;
  $('itemModalTitle').textContent=it?'Edit Item':'Add Item';
  $('f_id').value=it?it.id:'';
  $('f_name').value=it?it.name:'';
  $('f_category').value=it?it.category:'consumable';
  $('f_unit').value=it?it.unit:'pcs';
  $('f_room').value=it?it.room:'';
  $('f_spot').value=it?it.spot:'';
  $('f_qty').value=it?it.qty:1;
  $('f_dailyUse').value=it&&it.dailyUse?it.dailyUse:'';
  $('f_alertDays').value=it&&it.alertDays?it.alertDays:10;
  $('f_note').value=it?it.note:'';
  const rooms=[...new Set(state.items.map(i=>i.room).filter(Boolean))];
  $('roomList').innerHTML=rooms.map(r=>`<option value="${esc(r)}">`).join('');
  const hint=$('estimateHint');
  if(it){
    const est=estimateRate(it.id);
    hint.innerHTML=est?`Purchase history suggests ~${fmt(est)}/day. <a onclick="$('f_dailyUse').value='${fmt(est)}'">Use this estimate</a>`:'Add 2+ purchase records to auto-estimate usage rate.';
  }else hint.textContent='Not sure? Leave blank — you can estimate later from purchase records.';
  toggleConsumableFields();
  $('itemModal').classList.add('open');
  setTimeout(()=>$('f_name').focus(),50);
}
function toggleConsumableFields(){
  const isC=$('f_category').value==='consumable';
  document.querySelectorAll('[data-consumable]').forEach(e=>e.style.display=isC?'':'none');
}
function saveItem(){
  const name=$('f_name').value.trim();
  const room=$('f_room').value.trim();
  if(!name){toast('Please enter a name.');return;}
  if(!room){toast('Please enter a room so you can find it later.');return;}
  const data={
    name,category:$('f_category').value,unit:$('f_unit').value.trim()||'pcs',
    room,spot:$('f_spot').value.trim(),
    qty:parseFloat($('f_qty').value)||0,
    dailyUse:parseFloat($('f_dailyUse').value)||0,
    alertDays:parseFloat($('f_alertDays').value)||10,
    note:$('f_note').value.trim()
  };
  const id=$('f_id').value;
  if(id){Object.assign(state.items.find(i=>i.id===id),data);}
  else{state.items.push({id:uid(),createdAt:today(),...data});}
  persist();closeModal('itemModal');render();toast('Saved.');
}
function deleteItem(id){
  const it=state.items.find(i=>i.id===id);
  if(!confirm(`Delete "${it.name}"? Purchase records will remain in the log.`))return;
  state.items=state.items.filter(i=>i.id!==id);
  persist();render();
}
function adjustQty(id,d){
  const it=state.items.find(i=>i.id===id);
  it.qty=Math.max(0,(parseFloat(it.qty)||0)+d);
  persist();render();
}

/* ---------- Purchases ---------- */
function openPurchaseModal(itemId){
  if(!state.items.length){toast('Add an item first.');return;}
  const sel=$('p_itemSelect');
  sel.innerHTML=state.items.slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(i=>`<option value="${i.id}">${esc(i.name)} (${esc(i.room)})</option>`).join('');
  if(itemId)sel.value=itemId;
  $('p_date').value=today();$('p_qty').value=1;$('p_price').value='';$('p_note').value='';
  $('purchaseModal').classList.add('open');
}
function savePurchase(){
  const itemId=$('p_itemSelect').value;
  const qty=parseFloat($('p_qty').value);
  if(!qty||qty<=0){toast('Please enter a quantity.');return;}
  state.purchases.push({id:uid(),itemId,date:$('p_date').value||today(),qty,price:parseFloat($('p_price').value)||0,note:$('p_note').value.trim()});
  const it=state.items.find(i=>i.id===itemId);
  if(it)it.qty=(parseFloat(it.qty)||0)+qty;
  persist();closeModal('purchaseModal');render();toast('Added to stock.');
}
function deletePurchase(id){
  if(!confirm('Delete this purchase record? (Stock quantity will not be adjusted.)'))return;
  state.purchases=state.purchases.filter(x=>x.id!==id);
  persist();render();
}

/* ---------- Import / Export ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`home-inventory-backup-${today()}.json`;
  a.click();URL.revokeObjectURL(a.href);
}
function importData(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.items)||!Array.isArray(d.purchases))throw 0;
      if(!confirm(`Import ${d.items.length} items and ${d.purchases.length} purchase records? This will overwrite your current data.`))return;
      state=d;persist();render();toast('Import successful.');
    }catch(e){toast('Invalid file format.');}
    input.value='';
  };
  r.readAsText(f);
}
function clearAll(){
  if(!confirm('Clear all data? This cannot be undone. Consider exporting a backup first.'))return;
  if(!confirm('Are you sure? All items and purchase records will be permanently deleted.'))return;
  state={items:[],purchases:[]};persist();render();
}

/* ---------- Other ---------- */
function closeModal(id){$(id).classList.remove('open');}
document.querySelectorAll('.modal-mask').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-mask.open').forEach(m=>m.classList.remove('open'));});
$('search').addEventListener('input',render);

load();
</script>
</body>
</html>

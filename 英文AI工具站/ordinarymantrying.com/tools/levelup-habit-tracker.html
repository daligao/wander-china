<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">LevelUp Habit Tracker — Monthly Habit Calendar</h1>

    <div class="header">
        <div class="controls">
            <button onclick="changeMonth(-1)">◀ Previous</button>
            <h2 id="month-display">June 2026</h2>
            <button onclick="changeMonth(1)">Next ▶</button>
        </div>
        <div class="controls">
            <button class="btn-backup" onclick="exportData()">💾 Backup</button>
            <button class="btn-backup" onclick="document.getElementById('importFile').click()">📂 Restore</button>
            <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <div class="calendar-header">
        <div class="day-name">Sun</div><div class="day-name">Mon</div><div class="day-name">Tue</div>
        <div class="day-name">Wed</div><div class="day-name">Thu</div><div class="day-name">Fri</div><div class="day-name">Sat</div>
    </div>

    <div class="grid" id="calendar"></div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 id="modal-date">Daily Log</h3>
            <textarea id="modal-input" placeholder="What did you accomplish today?&#10;e.g.:&#10;Jump rope 1000&#10;Pull-ups 80&#10;Finished reading chapter 5"></textarea>
            <div class="modal-actions">
                <button onclick="closeModal()">Cancel</button>
                <button class="btn-primary" onclick="saveData()">Save</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'levelup_tracker_data';
        const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        let currentDate = new Date();
        let trackerData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        let editingDateStr = '';

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('month-display').innerText = `${MONTHS[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calendar');
            grid.innerHTML = '';

            for (let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div class="day-cell" style="background: transparent; border: none; cursor: default; box-shadow: none;"></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const content = trackerData[dateStr] || '';
                const isCompleted = content.trim().length > 0 ? 'completed' : '';

                grid.innerHTML += `
                    <div class="day-cell ${isCompleted}" onclick="openModal('${dateStr}')">
                        <span class="date-num">${i}</span><span class="content">${content}</span>
                    </div>
                `;
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function openModal(dateStr) {
            editingDateStr = dateStr;
            document.getElementById('modal-date').innerText = `${dateStr} — Daily Log`;
            document.getElementById('modal-input').value = trackerData[dateStr] || '';
            document.getElementById('editModal').style.display = 'flex';
            document.getElementById('modal-input').focus();
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function saveData() {
            const newContent = document.getElementById('modal-input').value.trim();
            if (newContent) {
                trackerData[editingDateStr] = newContent;
            } else {
                delete trackerData[editingDateStr];
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(trackerData));
            closeModal();
            renderCalendar();
        }

        function exportData() {
            const dataStr = JSON.stringify(trackerData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `LevelUp-backup-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    trackerData = importedData;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(trackerData));
                    renderCalendar();
                    alert("Data restored successfully!");
                } catch (err) {
                    alert("Invalid file format. Restore failed.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        renderCalendar();

        window.onclick = function(event) {
            if (event.target == document.getElementById('editModal')) {
                closeModal();
            }
        }
    </script>

<script>
/* ===================== CONFIG ===================== */
/* Leave blank — shares auto-use this page's own URL once hosted. Set to override. */
const SHARE_URL = "";
const POST_LOVE = "https://ordinarymantrying.com/i-fell-in-love-with-a-stock-my-ai-noticed-before-i-did/";
const POST_FLAW = "https://ordinarymantrying.com/ai-investment-handbook-second-opinion/";

/* Each question feeds one axis: C = conviction (live thesis), A = attachment (emotion).
   Option value = how much it adds to that axis (0 low → 3 high). */
const QUESTIONS = [
  { axis:"C", key:"exit",
    q:"Can you name the exact price or condition at which you'd sell {S}?",
    opts:[
      {t:"I have a written, specific exit rule",v:3},
      {t:"A rough number lives in my head",v:2},
      {t:"Something like \u201Cwhen it stops working\u201D",v:1},
      {t:"I haven't really thought about selling",v:0},
    ]},
  { axis:"A", key:"criticism",
    q:"Someone gives you a sharp, well-argued bear case on {S}. How do you react?",
    opts:[
      {t:"Good — I want the holes found",v:0},
      {t:"Mildly annoyed, but I listen",v:1},
      {t:"Defensive — I start arguing back",v:2},
      {t:"It feels personal, like they're attacking me",v:3},
    ]},
  { axis:"C", key:"disconfirm",
    q:"When did you last actively go looking for evidence that you're WRONG about {S}?",
    opts:[
      {t:"In the last month, on purpose",v:3},
      {t:"A while ago",v:2},
      {t:"I read bear cases but I dismiss them",v:1},
      {t:"Never — why would I?",v:0},
    ]},
  { axis:"A", key:"checks",
    q:"Day to day, what do you actually check more often for {S}?",
    opts:[
      {t:"The fundamentals — filings, numbers, the business",v:0},
      {t:"Both, about equally",v:1},
      {t:"Mostly the price",v:2},
      {t:"The price — several times a day",v:3},
    ]},
  { axis:"C", key:"would_buy",
    q:"If you didn't own {S} today, would you buy it at the current price?",
    opts:[
      {t:"Yes — and I can say exactly why",v:3},
      {t:"Probably",v:2},
      {t:"Not sure",v:1},
      {t:"No… but I'm still holding it",v:0},
    ]},
  { axis:"A", key:"drop30",
    q:"{S} drops 30% tomorrow on no real news. Your first feeling is:",
    opts:[
      {t:"Curiosity — opportunity, or a signal I missed?",v:0},
      {t:"Uncomfortable, but I'm okay",v:1},
      {t:"Anxious — I'd be checking constantly",v:2},
      {t:"Betrayed",v:3},
    ]},
  { axis:"C", key:"reason",
    q:"The original reason you bought {S} — is it still true today?",
    opts:[
      {t:"Yes, and I've re-checked the numbers recently",v:3},
      {t:"I think so",v:2},
      {t:"That reason faded, but I found a new one to hold",v:1},
      {t:"Honestly? The original reason is gone",v:0},
    ]},
  { axis:"A", key:"admit_wrong",
    q:"Be honest: is part of why you still hold {S} that selling would mean admitting you were wrong?",
    opts:[
      {t:"No — the decision is purely forward-looking",v:0},
      {t:"Maybe a little",v:1},
      {t:"Yes, that's part of it",v:2},
      {t:"Yes — and it's a big part",v:3},
    ]},
];

/* Rationalization patterns: fire(answers) returns true when the trap is present. */
const FLAGS = [
  { name:"Holding what you wouldn't buy",
    test:a => a.would_buy===0, // value 0 = "No… but I'm still holding"
    desc:"You wouldn't buy it at today's price — but you won't sell it either. Those two positions can't both be rational at once." },
  { name:"Moving the goalposts",
    test:a => a.reason===1, // value 1 = "that reason faded, but I found a new one"
    desc:"The thesis that got you in is gone, and a fresh reason appeared right when you needed one. That's not analysis — that's your conclusion hunting for a premise." },
  { name:"Price over substance",
    test:a => a.checks>=2,
    desc:"You watch the price more than the business. Price is the scoreboard, not the game — and watching it is how feeling quietly replaces thinking." },
  { name:"Sunk-cost & ego",
    test:a => a.admit_wrong>=2,
    desc:"Part of the hold is about not being wrong. But the market doesn't refund your pride — and \u201CI was right to buy\u201D and \u201CI'd be right to sell\u201D can both be true." },
  { name:"Echo chamber",
    test:a => a.disconfirm<=1,
    desc:"You don't go looking for the case against you. A thesis you never try to break isn't conviction — it's just comfort." },
  { name:"Taking it personally",
    test:a => a.criticism===3,
    desc:"An attack on the stock feels like an attack on you. Once a holding is part of your identity, selling it feels like losing a piece of yourself — and that's expensive." },
];

/* ===================== STATE ===================== */
const STAGE=document.getElementById('stage'), PROG=document.getElementById('prog'), TOAST=document.getElementById('toast');
let stock="";              // the holding name
let answers={};            // key -> chosen value
let idx=0;
let verdict=null;          // computed at end

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function sName(){ return stock ? `<span class="s">${esc(stock)}</span>` : `<span class="s">this stock</span>`; }
function sPlain(){ return stock || "this stock"; }

let toastT=null;
function toast(m){TOAST.textContent=m;TOAST.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>TOAST.classList.remove('show'),1800);}

function swap(html, prog){
  STAGE.classList.add('out');
  PROG.textContent = prog||"";
  setTimeout(()=>{ STAGE.innerHTML=html; STAGE.classList.remove('out'); window.scrollTo(0,0); bind(); }, 200);
}

/* ===================== SCREENS ===================== */
function intro(){
  swap(`
    <div class="stage-inner intro">
      <div class="eyebrow">The honest check</div>
      <h1>Are you holding it &mdash; or hugging it?</h1>
      <p>There's a moment when you stop analysing a company and start rooting for it. Most people cross that line without noticing. This is a two-minute way to notice.</p>
      <p>Pick <b>one stock you actually own</b> &mdash; ideally the one you'd least like to examine. Answer honestly; the test only works if you do.</p>
      <div class="field">
        <label for="stk">The holding</label>
        <input id="stk" type="text" maxlength="40" placeholder="e.g. its name or ticker" autocomplete="off">
      </div>
      <p class="small">Nothing you type is saved or sent anywhere. It never leaves this page.</p>
      <div style="margin-top:22px"><button class="btn" id="go">Begin &mdash; 8 questions</button></div>
    </div>`, "");
}

function question(i){
  idx=i;
  const Q=QUESTIONS[i];
  const dimLabel = Q.axis==="C"
    ? `<span class="dim">Conviction</span>`
    : `<span class="dim att">Attachment</span>`;
  const opts=Q.opts.map((o,oi)=>
    `<button class="opt" data-v="${o.v}" data-i="${oi}"><span class="dot"></span><span>${o.t}</span></button>`
  ).join("");
  swap(`
    <div class="stage-inner">
      <div class="qnum">Question ${i+1} &nbsp;·&nbsp; ${dimLabel}</div>
      <div class="qtext">${Q.q.replace("{S}", sName())}</div>
      <div class="opts">${opts}</div>
      <div class="thinline"><span style="width:${((i+1)/QUESTIONS.length)*100}%"></span></div>
    </div>`, `${i+1} / ${QUESTIONS.length}`);
}

function choose(i, val){
  answers[QUESTIONS[i].key] = val;
  if(i < QUESTIONS.length-1) question(i+1);
  else { compute(); result(); }
}

/* ===================== SCORING ===================== */
function compute(){
  let C=0, A=0;
  QUESTIONS.forEach(q=>{ const v=answers[q.key]||0; if(q.axis==="C") C+=v; else A+=v; });
  const maxAxis = 4*3; // 12
  const hiC = C>=6, hiA = A>=6;
  let q;
  if(hiC && !hiA) q={id:"clear", name:"Clear-eyed conviction"};
  else if(hiC && hiA) q={id:"inlove", name:"In love \u2014 but still right"};
  else if(!hiC && !hiA) q={id:"position", name:"Just a position"};
  else q={id:"attached", name:"Dangerously attached"};
  const fired = FLAGS.filter(f=>f.test(answers));
  verdict={ C, A, maxAxis, ...q, flags:fired };
}

function bodyCopy(id){
  const S=`<span class="s">${esc(sPlain())}</span>`;
  return ({
    clear:`You're holding ${S} on a live, falsifiable thesis, and you've kept your feelings out of the cockpit. This is what discipline actually looks like &mdash; rarer than people think. The only job now is to not drift from here.`,
    inlove:`Your thesis on ${S} holds up &mdash; the logic is real. But warmth is creeping in, and warmth is exactly how clear-eyed holders turn, slowly, into bag-holders. You're right today. The danger is you'll stop checking whether you still are.`,
    position:`No real conviction, no real attachment &mdash; so why is ${S} still in your account? A holding with no live reason isn't a bet, it's a leftover. Rebuild the thesis, or let it go and free the capital.`,
    attached:`The thesis is gone. What's left is the feeling. That isn't an investment in ${S} any more &mdash; it's a relationship, and it's the kind that quietly costs money. The hardest sentence in investing: \u201CI was right to buy it, and I'd be right to sell it.\u201D`
  })[id];
}
function closeNote(id){
  return ({
    clear:"Re-run this on the holding you're proudest of. That's the one this test is really for.",
    inlove:"Set a date to re-read your own bear case. Put it in the calendar before the warmth decides for you.",
    position:"\u201CI'll decide later\u201D is itself a decision. You're making it right now, by default.",
    attached:"You don't have to sell today. You do have to stop pretending the reason is still analysis."
  })[id];
}

/* ===================== RESULT ===================== */
function quadMap(C,A,max){
  // 320x320 plot; x = conviction (→ right), y = attachment (↑ up)
  const W=320,H=320, m=34, pw=W-m*2, ph=H-m*2;
  const x = m + (C/max)*pw;
  const y = m + (1-(A/max))*ph;
  const COL={conv:"#2D6E7E",att:"#C2553D",amber:"#B07A2B",grey:"#8A8A82",line:"#DAD6CC"};
  const col = verdict.id==="clear"?COL.conv:verdict.id==="inlove"?COL.amber:verdict.id==="position"?COL.grey:COL.att;
  const MONO="ui-monospace,Menlo,Consolas,monospace";
  const qlab=(tx,ty,t,c,anchor)=>`<text x="${tx}" y="${ty}" fill="${c}" font-family="${MONO}" font-size="10" font-weight="700" text-anchor="${anchor}" opacity="0.8">${t}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Conviction versus attachment map">
    <rect x="${m}" y="${m}" width="${pw}" height="${ph}" fill="none" stroke="${COL.line}" stroke-width="1"/>
    <line x1="${m+pw/2}" y1="${m}" x2="${m+pw/2}" y2="${m+ph}" stroke="${COL.line}" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="${m}" y1="${m+ph/2}" x2="${m+pw}" y2="${m+ph/2}" stroke="${COL.line}" stroke-width="1" stroke-dasharray="3 4"/>
    ${qlab(m+8, m+18, "DANGEROUSLY", COL.att,"start")}
    ${qlab(m+8, m+30, "ATTACHED", COL.att,"start")}
    ${qlab(m+pw-8, m+18, "IN LOVE,", COL.amber,"end")}
    ${qlab(m+pw-8, m+30, "STILL RIGHT", COL.amber,"end")}
    ${qlab(m+8, m+ph-10, "JUST A POSITION", COL.grey,"start")}
    ${qlab(m+pw-8, m+ph-22, "CLEAR-EYED", COL.conv,"end")}
    ${qlab(m+pw-8, m+ph-10, "CONVICTION", COL.conv,"end")}
    <circle cx="${x}" cy="${y}" r="13" fill="${col}" opacity="0.18"><animate attributeName="r" from="4" to="13" dur="0.5s" fill="freeze"/></circle>
    <circle cx="${x}" cy="${y}" r="6" fill="${col}"><animate attributeName="r" from="0" to="6" dur="0.4s" fill="freeze"/></circle>
    <text x="${m+pw/2}" y="${H-6}" fill="${COL.conv}" font-family="${MONO}" font-size="10" font-weight="700" text-anchor="middle">CONVICTION \u2192</text>
    <text x="14" y="${m+ph/2}" fill="${COL.att}" font-family="${MONO}" font-size="10" font-weight="700" text-anchor="middle" transform="rotate(-90 14 ${m+ph/2})">ATTACHMENT \u2192</text>
  </svg>`;
}

function result(){
  const v=verdict;
  const flagsHtml = v.flags.length
    ? v.flags.map(f=>`<div class="flag"><div class="fn">${f.name}</div><div class="fd">${f.desc}</div></div>`).join("")
    : `<div class="flag none"><div class="fn">No rationalization traps fired</div><div class="fd">You didn't lean on any of the usual self-deceptions. Keep it that way &mdash; they tend to show up later, as the position ages.</div></div>`;

  swap(`
    <div class="stage-inner">
      <div class="res-head">Verdict on <span style="font-family:var(--serif);font-style:italic">${esc(sPlain())}</span></div>
      <div class="verdict-name ${v.id}">${v.name}</div>
      <div class="verdict-body">${bodyCopy(v.id)}</div>

      <div class="map-wrap">
        ${quadMap(v.C, v.A, v.maxAxis)}
        <div class="axisrow">
          <span>Conviction <b>${v.C}/${v.maxAxis}</b></span>
          <span>Attachment <b>${v.A}/${v.maxAxis}</b></span>
        </div>
      </div>

      <div class="flags">
        <h3>What's running the decision</h3>
        ${flagsHtml}
      </div>

      <div class="close-note">${closeNote(v.id)}</div>

      <div class="cta">
        <p>This is the test I run on myself. The two times it caught me:</p>
        <a href="${POST_LOVE}" target="_blank" rel="noopener">I fell in love with a stock &mdash; my AI noticed first &rarr;</a>
        <a href="${POST_FLAW}" target="_blank" rel="noopener">The flaw I was hiding from myself &rarr;</a>
      </div>

      <div class="sharehead">Send it to an investor who needs it</div>
      <div class="sharegrid">
        <button class="share s-x"  data-p="x">X</button>
        <button class="share s-fb" data-p="facebook">Facebook</button>
        <button class="share s-wa" data-p="whatsapp">WhatsApp</button>
        <button class="share s-rd" data-p="reddit">Reddit</button>
        <button class="share s-tg" data-p="telegram">Telegram</button>
        <button class="share s-cp" data-p="copy">Copy</button>
      </div>

      <button class="btn line" id="again">Test another holding</button>
      <a class="backlink" href="https://ordinarymantrying.com/tools/sell-signal-checklist.html">Next → Should I Sell This Stock?</a>
    </div>`, "Result");
}

/* ===================== SHARE ===================== */
function getShareUrl(){
  if(SHARE_URL.trim()) return SHARE_URL.trim();
  if(location.protocol==="http:"||location.protocol==="https:") return location.origin+location.pathname;
  return "";
}
function share(p){
  const text=`I took the \u201CAre you holding it, or hugging it?\u201D test on one of my stocks \u2014 verdict: ${verdict.name}. Where do you land?`;
  const url=getShareUrl(), t=encodeURIComponent(text), u=encodeURIComponent(url);
  if(p==="copy"){
    const payload=text+(url?` ${url}`:"");
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(payload).then(()=>toast("Copied to clipboard"),()=>toast("Could not copy"));
    else toast("Copy not supported here");
    return;
  }
  let link="";
  switch(p){
    case "x":        link=`https://twitter.com/intent/tweet?text=${t}${url?'&url='+u:''}`; break;
    case "facebook": if(!url){toast("Sharing needs the page online first");return;} link=`https://www.facebook.com/sharer/sharer.php?u=${u}`; break;
    case "whatsapp": link=`https://wa.me/?text=${encodeURIComponent(text+(url?' '+url:''))}`; break;
    case "reddit":   link=`https://www.reddit.com/submit?title=${t}${url?'&url='+u:''}`; break;
    case "telegram": link=`https://t.me/share/url?url=${u||t}&text=${t}`; break;
  }
  window.open(link,"_blank","noopener");
}

/* ===================== EVENT BINDING ===================== */
function bind(){
  const go=document.getElementById('go');
  if(go){
    const inp=document.getElementById('stk');
    setTimeout(()=>inp&&inp.focus(),250);
    const start=()=>{ stock=(inp.value||"").trim(); answers={}; idx=0; question(0); };
    go.onclick=start;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') start(); });
  }
  document.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{ choose(idx, +b.dataset.v); };
  });
  const again=document.getElementById('again');
  if(again) again.onclick=()=>{ stock=""; answers={}; idx=0; intro(); };
  document.querySelectorAll('.share').forEach(b=> b.onclick=()=>share(b.dataset.p));
}

/* ===================== BOOT ===================== */
intro();

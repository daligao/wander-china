<style>
  :root{
    --bg-1:#0d130a; --bg-2:#172010;
    --device:#090e06; --bezel:#050804;
    --screen:#F8FAF5; --ink:#1a2015; --muted:#5a6a50;
    --line:#cfdcc8;
    --accent:#4A7C35; --accent-soft:#eaf3e5; --accent-ink:#fff;
    --warn:#B07A2B; --bad:#b5350a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--ink);
    background:radial-gradient(120% 120% at 50% 0%,var(--bg-2),var(--bg-1));
    display:flex; align-items:center; justify-content:center; padding:20px; min-height:100%;
  }
  .phone{
    width:370px; max-width:100%; height:760px; max-height:94vh;
    background:linear-gradient(160deg,#111a0d,var(--device));
    border-radius:46px; padding:13px;
    box-shadow:0 2px 0 #1e2c18 inset,0 40px 80px -30px #000,0 0 0 2px var(--bezel);
    position:relative; display:flex; flex-direction:column;
  }
  .notch{position:absolute; top:13px; left:50%; transform:translateX(-50%); width:138px; height:26px; background:var(--bezel); border-radius:0 0 18px 18px; z-index:5}
  .screen{flex:1; background:var(--screen); border-radius:34px; overflow:hidden; display:flex; flex-direction:column; position:relative}
  .statusbar{flex:0 0 auto; padding:14px 22px 8px; display:flex; align-items:center; justify-content:space-between}
  .brand{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .badge{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:4px 10px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .25s}
  .badge.show{opacity:1}
  .content{flex:1 1 0; overflow-y:auto; padding:6px 22px 18px; display:flex; flex-direction:column; transition:opacity .24s ease,transform .24s ease; -webkit-overflow-scrolling:touch}
  .content.leaving{opacity:0; transform:translateY(6px)}
  .content.blank{opacity:0}
  .btm{flex:0 0 auto; padding:10px 22px 18px; background:var(--screen); border-top:1px solid var(--line)}
  .eyebrow{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); font-weight:800; margin-bottom:12px}
  h1{font-size:25px; line-height:1.2; font-weight:800; letter-spacing:-.02em; margin-bottom:10px}
  h2{font-size:19px; line-height:1.25; font-weight:800; margin-bottom:4px}
  .lead{font-size:14px; line-height:1.55; color:var(--muted); margin-bottom:18px}
  .spacer{flex:1 1 auto; min-height:10px}
  .btn{appearance:none; border:none; cursor:pointer; width:100%; font-family:var(--sans); font-size:15px; font-weight:700; padding:14px; border-radius:14px; background:var(--accent); color:var(--accent-ink); transition:transform .08s,filter .12s; margin-bottom:8px; display:block}
  .btn:active{transform:scale(.985)} .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent; color:var(--muted); font-size:13px; font-weight:600; padding:10px}
  .btn:disabled{opacity:.35; cursor:not-allowed}
  .field{margin-bottom:20px}
  .field label{display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:7px}
  .field input{width:100%; font-size:20px; font-weight:700; color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:11px 13px; outline:none; font-family:var(--sans); transition:border-color .15s}
  .field input:focus{border-color:var(--accent)}
  .field input::placeholder{color:#b4ccaa; font-weight:400}
  .pbar-wrap{height:3px; background:var(--line); border-radius:99px; margin-bottom:14px}
  .pbar{height:100%; width:0%; background:var(--accent); border-radius:99px; transition:width .3s}
  .sec{font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--accent); margin-top:14px; margin-bottom:7px; padding-bottom:5px; border-bottom:1px solid var(--line)}
  .ci{display:flex; gap:11px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; -webkit-user-select:none}
  .ci:last-child{border-bottom:none}
  .ci-box{flex:0 0 20px; width:20px; height:20px; border:2px solid var(--line); border-radius:5px; margin-top:1px; display:flex; align-items:center; justify-content:center; background:#fff; transition:background .12s,border-color .12s}
  .ci.on .ci-box{background:var(--accent); border-color:var(--accent)}
  .ci.on .ci-box::after{content:"✓"; color:#fff; font-size:11px; font-weight:900; line-height:1}
  .ci-text{font-size:13px; line-height:1.45; color:var(--ink); transition:color .12s}
  .ci.on .ci-text{color:var(--accent)}
  /* results */
  .score-row{display:flex; align-items:baseline; gap:6px; margin:2px 0 4px}
  .score-num{font-family:var(--mono); font-size:62px; font-weight:800; line-height:1}
  .score-den{font-size:18px; font-weight:700; color:var(--muted)}
  .tier-name{font-size:15px; font-weight:800; margin-bottom:3px}
  .tier-note{font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:14px}
  .ri-grid{display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:16px}
  .ri{display:flex; align-items:center; gap:5px; padding:6px 8px; border-radius:8px; min-width:0}
  .ri.pass{background:var(--accent-soft)} .ri.fail{background:#fdf0ec}
  .ri-icon{font-size:11px; font-weight:900; flex:0 0 12px}
  .ri.pass .ri-icon{color:var(--accent)} .ri.fail .ri-icon{color:var(--bad)}
  .ri-name{font-size:11px; font-weight:700; line-height:1.3; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
  .ri.pass .ri-name{color:var(--accent)} .ri.fail .ri-name{color:var(--bad)}
  .sharehead{font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:var(--muted); margin:14px 0 8px; text-align:center}
  .sharegrid{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:10px}
  .share{appearance:none; border:none; cursor:pointer; color:#fff; font-family:var(--sans); font-size:13px; font-weight:700; padding:11px 8px; border-radius:11px; display:flex; align-items:center; justify-content:center; gap:6px; transition:transform .08s,filter .12s}
  .share:active{transform:scale(.97)} .share:hover{filter:brightness(1.08)}
  .s-x{background:#000} .s-wa{background:#25D366} .s-tg{background:#229ED9} .s-cp{background:#3a4850}
  .backlink{display:block; text-align:center; font-size:12px; color:var(--muted); text-decoration:none; padding:8px 0; margin-top:2px}
  .backlink:hover{color:var(--accent)}
  .toast{position:absolute; left:50%; bottom:24px; transform:translateX(-50%) translateY(18px); background:var(--ink); color:#fff; font-size:13px; font-weight:600; padding:10px 16px; border-radius:999px; opacity:0; pointer-events:none; white-space:nowrap; transition:opacity .22s,transform .22s; z-index:30}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){.content,.btn,.ci-box,.pbar,.share{transition:none}}
</style>

<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="statusbar">
      <span class="brand">Supermarket Test</span>
      <span class="badge" id="badge">0 / 10</span>
    </div>
    <div class="content" id="content"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script>
const TOOL_URL    = "https://ordinarymantrying.com/tools/grassroots-research-checklist.html";
const ARTICLE_URL = "https://ordinarymantrying.com/before-i-buy-a-stock-i-go-to-the-supermarket/";

const CRITERIA = [
  { section: "On the Shelf", key: "Fresh production date", items: [
    { key: "Fresh production date",  text: "The production date on the package is recent — the product is turning over, not sitting" },
    { key: "Eye-level position",     text: "The product holds eye-level or prime shelf position — retailers give this to items that move" },
    { key: "Adequate facing width",  text: "The brand occupies meaningful shelf space, not squeezed into one lonely slot" },
    { key: "No visible dust or damage", text: "Packaging is clean and intact — no signs the product is stuck or neglected" }
  ]},
  { section: "Staff & In-Store Signals", items: [
    { key: "Staff can identify it",     text: "A store employee knows what the product is without needing to check" },
    { key: "Staff says it sells",       text: "When asked, frontline staff confirm this product moves — or that one version is clearly more popular" },
    { key: "Restocked recently",        text: "The shelf has been restocked within a short window — there are signs of active replenishment" }
  ]},
  { section: "Digital & Direct Experience", items: [
    { key: "Visible online reviews",    text: "The product has real, current customer reviews online — not just older ratings" },
    { key: "Product available in 3+ stores", text: "You found it in multiple locations — not just one lucky visit" },
    { key: "You've tried the product",  text: "You've personally used or tested it — the most honest signal of all" }
  ]}
];

const ALL_ITEMS = CRITERIA.flatMap(s => s.items);
const TIERS = [
  { min:9,  label:"Thorough field check",   color:"#4A7C35", desc:"Strong grassroots signal. You've looked at what the numbers can't tell you — that's the edge." },
  { min:6,  label:"Good start",             color:"#4A7C35", desc:"Most signals checked. Fill the gaps before you commit capital." },
  { min:3,  label:"Partial research",       color:"#B07A2B", desc:"You've started, but there are important signals you haven't looked for yet." },
  { min:0,  label:"Don't invest yet",       color:"#b5350a", desc:"You haven't done the field work. Financial reports tell you what happened. The shelf tells you what's happening now." }
];

let company = "";
let checked = [];
let bottomBar = null;

const SCREEN  = document.querySelector('.screen');
const C       = document.getElementById('content');
const BADGE   = document.getElementById('badge');
const TOAST   = document.getElementById('toast');
let toastTimer = null;

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function score(){ return checked.filter(Boolean).length; }
function getTier(n){ return TIERS.find(t => n >= t.min); }

function toast(msg){
  TOAST.textContent = msg; TOAST.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => TOAST.classList.remove('show'), 1800);
}

function go(fn){
  C.classList.add('leaving');
  setTimeout(() => {
    C.innerHTML = ''; C.classList.remove('leaving'); C.classList.add('blank');
    setTimeout(() => { fn(); C.scrollTop = 0; C.classList.remove('blank'); }, 170);
  }, 210);
}

function setBottomBar(show, onclick){
  if(show && !bottomBar){
    bottomBar = document.createElement('div');
    bottomBar.className = 'btm';
    bottomBar.innerHTML = '<button class="btn" id="bb-btn">See the result →</button>';
    SCREEN.insertBefore(bottomBar, document.getElementById('toast'));
    bottomBar.querySelector('#bb-btn').onclick = onclick;
  } else if(!show && bottomBar){
    bottomBar.remove(); bottomBar = null;
  }
}

function intro(){
  setBottomBar(false);
  BADGE.classList.remove('show');
  const v = el(`<div>
    <div class="eyebrow">10-point field checklist</div>
    <h1>The Supermarket Test</h1>
    <p class="lead">Financial reports describe the past. The shelf in a store shows you what's happening right now. Before buying a consumer stock, go look. Check these 10 boxes.</p>
    <div class="field">
      <label>Company / brand you're researching</label>
      <input id="co-in" type="text" placeholder="e.g. Nongfu Spring" autocomplete="off" spellcheck="false">
    </div>
    <div class="spacer"></div>
    <button class="btn" id="start" disabled>Start the checklist →</button>
    <a class="backlink" href="${ARTICLE_URL}" target="_blank" rel="noopener">← Read: Before I Buy a Stock, I Go to the Supermarket</a>
  </div>`);
  C.innerHTML = ''; C.appendChild(v);
  const inp = v.querySelector('#co-in');
  const btn = v.querySelector('#start');
  if(company){ inp.value = company; btn.disabled = false; }
  inp.addEventListener('input', () => { company = inp.value.trim(); btn.disabled = !company; });
  inp.addEventListener('keydown', e => { if(e.key === 'Enter' && company) go(checklist); });
  btn.onclick = () => { if(company) go(checklist); };
  setTimeout(() => inp.focus(), 320);
}

function checklist(){
  checked = new Array(10).fill(false);
  BADGE.textContent = '0 / 10'; BADGE.classList.add('show');

  let idx = 0;
  const sections = CRITERIA.map(sec => {
    const rows = sec.items.map(item => {
      const i = idx++;
      return `<div class="ci" data-i="${i}">
        <div class="ci-box"></div>
        <div class="ci-text">${item.text}</div>
      </div>`;
    }).join('');
    return `<div class="sec">${sec.section}</div>${rows}`;
  }).join('');

  const v = el(`<div>
    <div class="eyebrow">${company}</div>
    <h2>Check what you've actually observed</h2>
    <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
    ${sections}
  </div>`);
  C.innerHTML = ''; C.appendChild(v);

  const pbar = v.querySelector('#pbar');
  const syncUI = () => {
    const n = score();
    BADGE.textContent = n + ' / 10';
    pbar.style.width = (n / 10 * 100) + '%';
    v.querySelectorAll('.ci').forEach((row, i) => row.classList.toggle('on', checked[i]));
  };

  v.querySelectorAll('.ci').forEach(row => {
    row.addEventListener('click', () => { checked[+row.dataset.i] = !checked[+row.dataset.i]; syncUI(); });
  });

  setBottomBar(true, () => go(results));
  syncUI();
}

function results(){
  setBottomBar(false);
  BADGE.classList.remove('show');
  const n = score();
  const tier = getTier(n);

  const riGrid = ALL_ITEMS.map((item, i) => {
    const p = checked[i];
    return `<div class="ri ${p ? 'pass' : 'fail'}">
      <span class="ri-icon">${p ? '✓' : '✗'}</span>
      <span class="ri-name">${item.key}</span>
    </div>`;
  }).join('');

  const v = el(`<div>
    <div class="eyebrow">${company}</div>
    <div class="score-row">
      <span class="score-num" style="color:${tier.color}">${n}</span>
      <span class="score-den">/ 10</span>
    </div>
    <div class="tier-name" style="color:${tier.color}">${tier.label}</div>
    <div class="tier-note">${tier.desc}</div>
    <div class="ri-grid">${riGrid}</div>
    <div class="sharehead">Share this result</div>
    <div class="sharegrid">
      <button class="share s-x"  data-p="x">𝕏 Post</button>
      <button class="share s-wa" data-p="whatsapp">WhatsApp</button>
      <button class="share s-tg" data-p="telegram">Telegram</button>
      <button class="share s-cp" data-p="copy">Copy link</button>
    </div>
    <button class="btn" id="retry">Check another company</button>
    <button class="btn ghost" id="redo">← Re-check ${company}</button>
    <a class="backlink" href="https://ordinarymantrying.com/tools/10x-stock-screener.html">Next → Run the Full 10× Screen</a>
    <a class="backlink" href="${ARTICLE_URL}" target="_blank" rel="noopener">← Read: Before I Buy a Stock, I Go to the Supermarket</a>
  </div>`);
  C.innerHTML = ''; C.appendChild(v);
  v.querySelectorAll('.share').forEach(b => b.onclick = () => doShare(b.dataset.p, n));
  v.querySelector('#retry').onclick = () => { company = ''; checked = []; go(intro); };
  v.querySelector('#redo').onclick  = () => go(checklist);
}

function doShare(platform, n){
  const tier = getTier(n);
  const text = `I ran "${company}" through the Supermarket Test — checked ${n}/10 grassroots signals (${tier.label}). Financial reports tell you what happened. The shelf tells you what's happening now.`;
  const url  = TOOL_URL;
  const t = encodeURIComponent(text), u = encodeURIComponent(url);
  if(platform === 'copy'){
    const pay = text + ' ' + url;
    const fb = () => { try{ const ta=document.createElement('textarea'); ta.value=pay; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Copied!'); }catch{ toast('Could not copy'); } };
    if(navigator.clipboard?.writeText) navigator.clipboard.writeText(pay).then(()=>toast('Copied!'), fb);
    else fb();
    return;
  }
  let link = '';
  switch(platform){
    case 'x':        link = `https://twitter.com/intent/tweet?text=${t}&url=${u}`; break;
    case 'whatsapp': link = `https://wa.me/?text=${encodeURIComponent(text+' '+url)}`; break;
    case 'telegram': link = `https://t.me/share/url?url=${u}&text=${t}`; break;
  }
  if(link) window.open(link, '_blank', 'noopener');
}

intro();
</script>

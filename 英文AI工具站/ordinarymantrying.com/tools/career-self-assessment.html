<style>
  :root{
    --bg-1:#0a0d1a; --bg-2:#131829;
    --device:#080a12; --bezel:#040508;
    --screen:#F7F8FA; --ink:#18192a; --muted:#5a6080;
    --line:#d0d5e8;
    --accent:#3B5BDB; --accent-soft:#edf2ff; --accent-ink:#fff;
    --good:#2A6B38; --bad:#b5350a;
    --d1:#3B5BDB; --d2:#1098AD; --d3:#9A3412; --d4:#7950F2;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--ink);
    background:radial-gradient(120% 120% at 50% 0%,var(--bg-2),var(--bg-1));
    display:flex; align-items:center; justify-content:center; padding:20px; min-height:100%;
  }
  .phone{
    width:370px; max-width:100%; height:760px; max-height:94vh;
    background:linear-gradient(160deg,#0e1120,var(--device));
    border-radius:46px; padding:13px;
    box-shadow:0 2px 0 #1e2240 inset,0 40px 80px -30px #000,0 0 0 2px var(--bezel);
    position:relative; display:flex; flex-direction:column;
  }
  .notch{position:absolute; top:13px; left:50%; transform:translateX(-50%); width:138px; height:26px; background:var(--bezel); border-radius:0 0 18px 18px; z-index:5}
  .screen{flex:1; background:var(--screen); border-radius:34px; overflow:hidden; display:flex; flex-direction:column; position:relative}
  .statusbar{flex:0 0 auto; padding:14px 22px 8px; display:flex; align-items:center; justify-content:space-between}
  .brand{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .badge{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:4px 10px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .25s}
  .badge.show{opacity:1}
  .content{flex:1 1 0; overflow-y:auto; padding:6px 22px 18px; display:flex; flex-direction:column; transition:opacity .24s ease,transform .24s ease; -webkit-overflow-scrolling:touch}
  .content.leaving{opacity:0; transform:translateY(6px)}
  .content.blank{opacity:0}
  .btm{flex:0 0 auto; padding:10px 22px 18px; background:var(--screen); border-top:1px solid var(--line)}
  .eyebrow{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); font-weight:800; margin-bottom:12px}
  h1{font-size:25px; line-height:1.2; font-weight:800; letter-spacing:-.02em; margin-bottom:10px}
  h2{font-size:18px; line-height:1.25; font-weight:800; margin-bottom:4px}
  .lead{font-size:14px; line-height:1.55; color:var(--muted); margin-bottom:18px}
  .spacer{flex:1 1 auto; min-height:10px}
  .btn{appearance:none; border:none; cursor:pointer; width:100%; font-family:var(--sans); font-size:15px; font-weight:700; padding:14px; border-radius:14px; background:var(--accent); color:var(--accent-ink); transition:transform .08s,filter .12s; margin-bottom:8px; display:block}
  .btn:active{transform:scale(.985)} .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent; color:var(--muted); font-size:13px; font-weight:600; padding:10px}
  .btn:disabled{opacity:.35; cursor:not-allowed}
  .field{margin-bottom:20px}
  .field label{display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:7px}
  .field input{width:100%; font-size:18px; font-weight:700; color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:11px 13px; outline:none; font-family:var(--sans); transition:border-color .15s}
  .field input:focus{border-color:var(--accent)}
  .field input::placeholder{color:#b0b8d8; font-weight:400}
  .pbar-wrap{height:3px; background:var(--line); border-radius:99px; margin-bottom:14px}
  .pbar{height:100%; width:0%; border-radius:99px; transition:width .3s}
  .sec{font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; margin-top:14px; margin-bottom:7px; padding-bottom:5px; border-bottom:1px solid var(--line)}
  .ci{display:flex; gap:11px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; -webkit-user-select:none}
  .ci:last-child{border-bottom:none}
  .ci-box{flex:0 0 20px; width:20px; height:20px; border:2px solid var(--line); border-radius:5px; margin-top:1px; display:flex; align-items:center; justify-content:center; background:#fff; transition:background .12s,border-color .12s}
  .ci.on .ci-box{background:var(--accent); border-color:var(--accent)}
  .ci.on .ci-box::after{content:"✓"; color:#fff; font-size:11px; font-weight:900; line-height:1}
  .ci-text{font-size:13px; line-height:1.45; color:var(--ink); transition:color .12s}
  .ci.on .ci-text{color:var(--accent)}
  /* results */
  .score-row{display:flex; align-items:baseline; gap:6px; margin:2px 0 4px}
  .score-num{font-family:var(--mono); font-size:62px; font-weight:800; line-height:1}
  .score-den{font-size:18px; font-weight:700; color:var(--muted)}
  .tier-name{font-size:15px; font-weight:800; margin-bottom:3px}
  .tier-note{font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:14px}
  /* dimension bars */
  .dim-list{margin-bottom:16px}
  .dim-row{margin-bottom:10px}
  .dim-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px}
  .dim-name{font-size:12px; font-weight:700}
  .dim-score{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--muted)}
  .dim-bar-bg{height:6px; background:var(--line); border-radius:99px; overflow:hidden}
  .dim-bar{height:100%; border-radius:99px; transition:width .5s ease}
  .sharehead{font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:var(--muted); margin:14px 0 8px; text-align:center}
  .sharegrid{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:10px}
  .share{appearance:none; border:none; cursor:pointer; color:#fff; font-family:var(--sans); font-size:13px; font-weight:700; padding:11px 8px; border-radius:11px; display:flex; align-items:center; justify-content:center; gap:6px; transition:transform .08s,filter .12s}
  .share:active{transform:scale(.97)} .share:hover{filter:brightness(1.08)}
  .s-x{background:#000} .s-wa{background:#25D366} .s-tg{background:#229ED9} .s-cp{background:#3a4850}
  .backlink{display:block; text-align:center; font-size:12px; color:var(--muted); text-decoration:none; padding:8px 0; margin-top:2px}
  .backlink:hover{color:var(--accent)}
  .toast{position:absolute; left:50%; bottom:24px; transform:translateX(-50%) translateY(18px); background:var(--ink); color:#fff; font-size:13px; font-weight:600; padding:10px 16px; border-radius:999px; opacity:0; pointer-events:none; white-space:nowrap; transition:opacity .22s,transform .22s; z-index:30}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){.content,.btn,.ci-box,.pbar,.dim-bar,.share{transition:none}}
</style>

<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="statusbar">
      <span class="brand">Career Check</span>
      <span class="badge" id="badge">0 / 12</span>
    </div>
    <div class="content" id="content"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script>
const TOOL_URL    = "https://ordinarymantrying.com/tools/career-self-assessment.html";
const ARTICLE_URL = "https://ordinarymantrying.com/ai-career-roadmap-45-it-professional/";

const DIMENSIONS = [
  {
    name: "AI at Work", color: "#3B5BDB", items: [
      "I use AI to automate at least one repetitive part of my job (reports, logs, documentation)",
      "My AI-assisted output is measurably faster or better than my manual output",
      "I can clearly explain to a manager or colleague what I've automated and what it saves"
    ]
  },
  {
    name: "Continuous Learning", color: "#1098AD", items: [
      "I spend time each week on something in my field that is currently unfamiliar to me",
      "My skills and certifications reflect standards from the last 2 years, not 5+ years ago",
      "I can have a basic conversation about the new technologies entering my field — even the ones I don't use yet"
    ]
  },
  {
    name: "Financial Resilience", color: "#9A3412", items: [
      "I have enough savings or passive income that I could walk away from a bad work situation without panic",
      "My financial position is not entirely dependent on this specific employer or role",
      "I am actively building something outside my salary — investments, a side income, or both"
    ]
  },
  {
    name: "Health as Infrastructure", color: "#7950F2", items: [
      "I get enough sleep to think clearly most days — not just survive meetings",
      "I exercise regularly enough to maintain the energy and focus the next 10 years will require",
      "I treat my physical condition as a professional asset, not a personal lifestyle choice"
    ]
  }
];

const ALL_ITEMS = DIMENSIONS.flatMap(d => d.items);
const TIERS = [
  { min:10, label:"Well-positioned",    color:"#2A6B38", desc:"Strong across all four dimensions. The compounding is already happening." },
  { min:7,  label:"Solid foundation",   color:"#3B5BDB", desc:"A few gaps — but the core is working. Identify the weakest dimension and be intentional about it." },
  { min:4,  label:"Partial readiness",  color:"#B07A2B", desc:"Real gaps in more than one area. The next five years will be harder if these don't improve." },
  { min:0,  label:"Needs a plan",       color:"#b5350a", desc:"Multiple areas need attention. The gap between where you are and where you need to be is closeable — but it takes intention." }
];

let jobTitle = "";
let checked = [];
let bottomBar = null;

const SCREEN  = document.querySelector('.screen');
const C       = document.getElementById('content');
const BADGE   = document.getElementById('badge');
const TOAST   = document.getElementById('toast');
let toastTimer = null;

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function score(){ return checked.filter(Boolean).length; }
function dimScore(di){ return DIMENSIONS[di].items.map((_,j) => checked[di*3+j]).filter(Boolean).length; }
function getTier(n){ return TIERS.find(t => n >= t.min); }

function toast(msg){
  TOAST.textContent = msg; TOAST.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => TOAST.classList.remove('show'), 1800);
}

function go(fn){
  C.classList.add('leaving');
  setTimeout(() => {
    C.innerHTML = ''; C.classList.remove('leaving'); C.classList.add('blank');
    setTimeout(() => { fn(); C.scrollTop = 0; C.classList.remove('blank'); }, 170);
  }, 210);
}

function setBottomBar(show, onclick){
  if(show && !bottomBar){
    bottomBar = document.createElement('div');
    bottomBar.className = 'btm';
    bottomBar.innerHTML = '<button class="btn" id="bb-btn">See my score →</button>';
    SCREEN.insertBefore(bottomBar, document.getElementById('toast'));
    bottomBar.querySelector('#bb-btn').onclick = onclick;
  } else if(!show && bottomBar){
    bottomBar.remove(); bottomBar = null;
  }
}

function intro(){
  setBottomBar(false);
  BADGE.classList.remove('show');
  const v = el(`<div>
    <div class="eyebrow">4-dimension career check</div>
    <h1>Is Your Tech Career Ready for the Next 5 Years?</h1>
    <p class="lead">AI built this framework from 10 months of career conversations. Four dimensions, 12 checkboxes — the honest version of where you stand.</p>
    <div class="field">
      <label>Your current role</label>
      <input id="job-in" type="text" placeholder="e.g. IT Operations, 45" autocomplete="off" spellcheck="false">
    </div>
    <div class="spacer"></div>
    <button class="btn" id="start" disabled>Start the assessment →</button>
    <a class="backlink" href="${ARTICLE_URL}" target="_blank" rel="noopener">← Read: AI Planned My Next 5 Years at 45</a>
  </div>`);
  C.innerHTML = ''; C.appendChild(v);
  const inp = v.querySelector('#job-in');
  const btn = v.querySelector('#start');
  if(jobTitle){ inp.value = jobTitle; btn.disabled = false; }
  inp.addEventListener('input', () => { jobTitle = inp.value.trim(); btn.disabled = !jobTitle; });
  inp.addEventListener('keydown', e => { if(e.key === 'Enter' && jobTitle) go(checklist); });
  btn.onclick = () => { if(jobTitle) go(checklist); };
  setTimeout(() => inp.focus(), 320);
}

function checklist(){
  checked = new Array(12).fill(false);
  BADGE.textContent = '0 / 12'; BADGE.classList.add('show');

  let idx = 0;
  const sections = DIMENSIONS.map(dim => {
    const rows = dim.items.map(text => {
      const i = idx++;
      return `<div class="ci" data-i="${i}">
        <div class="ci-box"></div>
        <div class="ci-text">${text}</div>
      </div>`;
    }).join('');
    return `<div class="sec" style="color:${dim.color};border-bottom-color:${dim.color}40">${dim.name}</div>${rows}`;
  }).join('');

  const v = el(`<div>
    <div class="eyebrow">${jobTitle}</div>
    <h2>Check what genuinely applies</h2>
    <div class="pbar-wrap"><div class="pbar" id="pbar" style="background:var(--accent)"></div></div>
    ${sections}
  </div>`);
  C.innerHTML = ''; C.appendChild(v);

  const pbar = v.querySelector('#pbar');
  const syncUI = () => {
    const n = score();
    BADGE.textContent = n + ' / 12';
    pbar.style.width = (n / 12 * 100) + '%';
    v.querySelectorAll('.ci').forEach((row, i) => row.classList.toggle('on', checked[i]));
  };

  v.querySelectorAll('.ci').forEach(row => {
    row.addEventListener('click', () => { checked[+row.dataset.i] = !checked[+row.dataset.i]; syncUI(); });
  });

  setBottomBar(true, () => go(results));
  syncUI();
}

function results(){
  setBottomBar(false);
  BADGE.classList.remove('show');
  const n = score();
  const tier = getTier(n);

  const dimBars = DIMENSIONS.map((dim, di) => {
    const ds = dimScore(di);
    const pct = Math.round(ds / 3 * 100);
    return `<div class="dim-row">
      <div class="dim-head">
        <span class="dim-name" style="color:${dim.color}">${dim.name}</span>
        <span class="dim-score">${ds} / 3</span>
      </div>
      <div class="dim-bar-bg">
        <div class="dim-bar" style="width:${pct}%;background:${dim.color}"></div>
      </div>
    </div>`;
  }).join('');

  /* weakest dimension */
  const weakDi = DIMENSIONS.reduce((wi, _, di, arr) => dimScore(di) < dimScore(wi) ? di : wi, 0);
  const weakDim = DIMENSIONS[weakDi];

  const v = el(`<div>
    <div class="eyebrow">${jobTitle}</div>
    <div class="score-row">
      <span class="score-num" style="color:${tier.color}">${n}</span>
      <span class="score-den">/ 12</span>
    </div>
    <div class="tier-name" style="color:${tier.color}">${tier.label}</div>
    <div class="tier-note">${tier.desc}</div>
    <div class="dim-list">${dimBars}</div>
    ${n < 12 ? `<div style="background:${weakDim.color}18;border-radius:10px;padding:10px 12px;margin-bottom:14px">
      <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:${weakDim.color};margin-bottom:4px">Weakest dimension</div>
      <div style="font-size:13px;line-height:1.5;color:var(--ink)">${weakDim.name} — ${dimScore(weakDi)}/3. This is the area most worth being intentional about first.</div>
    </div>` : ''}
    <div class="sharehead">Share this result</div>
    <div class="sharegrid">
      <button class="share s-x"  data-p="x">𝕏 Post</button>
      <button class="share s-wa" data-p="whatsapp">WhatsApp</button>
      <button class="share s-tg" data-p="telegram">Telegram</button>
      <button class="share s-cp" data-p="copy">Copy link</button>
    </div>
    <button class="btn" id="retry">Try a different role</button>
    <button class="btn ghost" id="redo">← Re-check ${jobTitle}</button>
    <a class="backlink" href="${ARTICLE_URL}" target="_blank" rel="noopener">← Read: AI Planned My Next 5 Years at 45</a>
  </div>`);
  C.innerHTML = ''; C.appendChild(v);
  v.querySelectorAll('.share').forEach(b => b.onclick = () => doShare(b.dataset.p, n));
  v.querySelector('#retry').onclick = () => { jobTitle = ''; checked = []; go(intro); };
  v.querySelector('#redo').onclick  = () => go(checklist);
}

function doShare(platform, n){
  const tier = getTier(n);
  const text = `I scored ${n}/12 on the Tech Career at 40+ self-assessment (${tier.label}). Four dimensions: AI at work, learning, finances, health. How does yours stack up?`;
  const url  = TOOL_URL;
  const t = encodeURIComponent(text), u = encodeURIComponent(url);
  if(platform === 'copy'){
    const pay = text + ' ' + url;
    const fb = () => { try{ const ta=document.createElement('textarea'); ta.value=pay; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Copied!'); }catch{ toast('Could not copy'); } };
    if(navigator.clipboard?.writeText) navigator.clipboard.writeText(pay).then(()=>toast('Copied!'), fb);
    else fb();
    return;
  }
  let link = '';
  switch(platform){
    case 'x':        link = `https://twitter.com/intent/tweet?text=${t}&url=${u}`; break;
    case 'whatsapp': link = `https://wa.me/?text=${encodeURIComponent(text+' '+url)}`; break;
    case 'telegram': link = `https://t.me/share/url?url=${u}&text=${t}`; break;
  }
  if(link) window.open(link, '_blank', 'noopener');
}

intro();
</script>
</body>

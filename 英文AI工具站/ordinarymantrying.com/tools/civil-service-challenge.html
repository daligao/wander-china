<title>Could You Pass China's Civil Service Exam?</title>
<style>
  :root{
    --bg-1:#1b2430; --bg-2:#2c3e44;
    --device:#0d1216; --bezel:#05080a;
    --screen:#FBF7F2; --ink:#1f2933; --muted:#717c87;
    --line:#e7ded3;
    --accent:#FF6B5B; --accent-ink:#fff;
    --teal:#1f8a82; --teal-soft:#e3f2f0;
    --good:#1f8a82; --bad:#d8654f; --warn:#d98324;
    --tile:#fff; --tile-line:#ece2d6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0; font-family:var(--sans); color:var(--ink);
    background:radial-gradient(120% 120% at 50% 0%,var(--bg-2),var(--bg-1));
    display:flex; align-items:center; justify-content:center; padding:20px}

  .phone{width:370px; max-width:100%; height:760px; max-height:94vh;
    background:linear-gradient(160deg,#14191d,var(--device));
    border-radius:46px; padding:13px;
    box-shadow:0 2px 0 #2a3137 inset,0 40px 80px -30px #000,0 0 0 2px var(--bezel); position:relative}
  .notch{position:absolute; top:13px; left:50%; transform:translateX(-50%);
    width:138px; height:26px; background:var(--bezel); border-radius:0 0 18px 18px; z-index:5}
  .screen{position:relative; height:100%; background:var(--screen);
    border-radius:34px; overflow:hidden; display:flex; flex-direction:column}

  .statusbar{flex:0 0 auto; padding:14px 22px 6px; display:flex; align-items:center; justify-content:space-between}
  .brand{font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .clock{font-family:var(--mono); font-size:14px; font-weight:700; color:var(--teal);
    background:var(--teal-soft); padding:5px 11px; border-radius:999px; min-width:62px; text-align:center; transition:opacity .3s, color .2s, background .2s}
  .clock.idle{opacity:0}
  .clock.urgent{color:#fff; background:var(--bad); animation:pulse .6s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .bar{flex:0 0 auto; height:4px; margin:2px 22px 0; background:var(--tile-line); border-radius:99px; overflow:hidden; opacity:0; transition:opacity .3s}
  .bar.show{opacity:1}
  .bar > span{display:block; height:100%; width:100%; background:var(--teal); border-radius:99px; transition:width .1s linear, background .2s}
  .bar.urgent > span{background:var(--bad)}

  .content{flex:1 1 auto; padding:10px 24px 26px; overflow-y:auto; display:flex; flex-direction:column;
    transition:opacity .26s ease, transform .26s ease}
  .content.leaving{opacity:0; transform:translateY(8px)} .content.blank{opacity:0}

  .step{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800; margin:4px 0 14px; display:flex; gap:10px; align-items:center}
  .qtag{color:var(--muted); font-weight:700}
  h1{font-size:29px; line-height:1.15; margin:0 0 12px; font-weight:800; letter-spacing:-.02em}
  h2{font-size:21px; line-height:1.32; margin:0 0 6px; font-weight:800; letter-spacing:-.01em}
  .sub{font-size:13px; color:var(--muted); margin:0 0 14px}
  p.lead{font-size:16px; line-height:1.5; color:var(--muted); margin:0 0 22px}
  .stats{display:flex; gap:10px; margin:0 0 20px}
  .stat{flex:1; background:#fff; border:1.5px solid var(--tile-line); border-radius:14px; padding:12px; text-align:center}
  .stat b{display:block; font-family:var(--mono); font-size:22px; font-weight:700; color:var(--ink)}
  .stat span{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
  .spacer{flex:1 1 auto}

  .btn{appearance:none; border:none; cursor:pointer; width:100%; font-family:var(--sans);
    font-size:17px; font-weight:700; padding:16px; border-radius:16px;
    background:var(--accent); color:var(--accent-ink); transition:transform .08s, filter .15s}
  .btn:active{transform:scale(.98)} .btn:hover{filter:brightness(1.04)}
  .btn.ghost{background:transparent; color:var(--muted); font-weight:600; font-size:14px; padding:12px}
  .btn:focus-visible,.choice:focus-visible,.share:focus-visible{outline:3px solid var(--teal); outline-offset:2px}

  .choices{display:flex; flex-direction:column; gap:10px; margin-top:4px}
  .choice{appearance:none; cursor:pointer; font-family:var(--sans); text-align:left;
    background:var(--tile); border:1.5px solid var(--tile-line); color:var(--ink);
    font-size:16px; font-weight:600; line-height:1.4; padding:15px 16px; border-radius:14px;
    display:flex; gap:11px; align-items:flex-start; transition:transform .08s, border-color .15s}
  .choice .key{font-weight:800; color:var(--accent); flex:0 0 auto}
  .choice:hover{border-color:var(--accent)} .choice:active{transform:scale(.99)}

  .flash{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(216,101,79,.94); color:#fff; font-size:24px; font-weight:800; letter-spacing:.02em;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:15}
  .flash.show{opacity:1}

  /* results */
  .score-ring{display:flex; align-items:baseline; gap:8px; margin:2px 0 6px}
  .score-ring .num{font-family:var(--mono); font-size:60px; font-weight:700; line-height:1; color:var(--accent)}
  .score-ring .den{font-size:22px; font-weight:700; color:var(--muted)}
  .tier{font-size:17px; font-weight:800; line-height:1.4; margin:0 0 12px}
  .rmeta{display:flex; gap:10px; margin:0 0 6px}
  .rmeta .stat b{font-size:18px}
  .note{font-size:13px; color:var(--muted); line-height:1.55; margin:14px 0 18px}

  .card{border:1.5px solid var(--line); border-radius:16px; padding:15px 16px; margin:0 0 12px; background:#fff}
  .card .ctag{font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:800; color:var(--accent); margin:0 0 8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .verdict{font-family:var(--mono); font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; color:#fff}
  .verdict.ok{background:var(--good)} .verdict.miss{background:var(--bad)} .verdict.out{background:var(--warn)}
  .card .qt{font-size:14px; font-weight:700; line-height:1.45; margin:0 0 10px}
  .card .ans{font-size:13px; line-height:1.5; margin:0 0 3px}
  .card .ans .k{color:var(--muted)} .card .ans .ok{color:var(--good); font-weight:700} .card .ans .miss{color:var(--bad); font-weight:700}
  .card .why{font-size:13px; line-height:1.6; color:var(--ink); margin:10px 0 0; padding-top:10px; border-top:1px solid var(--line)}

  .cta{background:var(--teal-soft); border-radius:16px; padding:16px; margin:18px 0 8px}
  .cta p{margin:0 0 10px; font-size:14px; line-height:1.5; color:#155a55; font-weight:600}
  .cta a{display:block; text-align:center; text-decoration:none; background:var(--teal); color:#fff; font-weight:700; padding:13px; border-radius:13px; font-size:15px}

  .sharehead{font-size:14px; font-weight:800; margin:20px 0 10px; text-align:center}
  .sharegrid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:8px}
  .share{appearance:none; border:none; cursor:pointer; color:#fff; font-family:var(--sans);
    font-size:14px; font-weight:700; padding:13px; border-radius:13px;
    display:flex; align-items:center; justify-content:center; gap:7px; transition:transform .08s, filter .15s}
  .share:active{transform:scale(.97)} .share:hover{filter:brightness(1.07)}
  .s-x{background:#000} .s-fb{background:#1877F2} .s-wa{background:#25D366}
  .s-rd{background:#FF4500} .s-tg{background:#229ED9} .s-cp{background:#3a4750}

  .toast{position:absolute; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; font-size:14px; font-weight:600; padding:11px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:20}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion: reduce){
    .content,.btn,.choice,.share,.clock,.bar>span{transition:none} .clock.urgent{animation:none}
  }
</style>

      <div class="statusbar">
        <span class="brand">🇨🇳 行测 · Aptitude Test</span>
        <span class="clock idle" id="clock">0:60</span>

<script>
/* ===================== CONFIG ===================== */
/* This tool's fixed public URL — used in every social share. */
const SHARE_URL = "https://ordinarymantrying.com/tools/civil-service-challenge.html";
/* Where the result screen sends people next (your blog post). */
const BLOG_URL  = "https://ordinarymantrying.com/ai-civil-service-exam-guide-china/";

/* Real-exam pace: ~120+ questions in 120 minutes — under a minute each, reading included.
   Each question below gets a tight countdown; run out and it auto-advances as a miss. */
const QUESTIONS = [
  {
    tag:"Number reasoning", time:50,
    q:"Find the next number in the sequence:  2, 3, 6, 15, ?",
    options:["32","42","52","62"],
    answer:1,
    why:"The gaps between terms are 1, 3, 9, 27 — successive powers of three (3⁰, 3¹, 3², 3³). So the next gap is 27: 15 + 27 = 42."
  },
  {
    tag:"Science / common sense", time:55,
    q:"Each abnormal health-check result is paired with a disease. Which pairing is LEAST likely to be correct?",
    options:[
      "White blood cell count above range → appendicitis",
      "ALT (a liver enzyme) above range → coronary heart disease",
      "Red blood cell count below range → anemia",
      "AFP above range → liver cancer"
    ],
    answer:1,
    why:"ALT (alanine aminotransferase) is a liver enzyme — a raised level flags liver damage, not heart disease. Coronary problems show up in cardiac markers like troponin and in blood lipids. The other three pairings are textbook-correct."
  },
  {
    tag:"Clock problem", time:55,
    q:"A watch loses 4 minutes every hour. It is set to the correct time at 8:00 a.m. When the watch later reads 3:00 p.m. (15:00), what is the true time?",
    options:["15:15","15:30","15:35","15:45"],
    answer:1,
    why:"The watch shows only 56 minutes for every 60 real minutes. From 8:00 it has shown 7 hours = 420 watch-minutes. Real time = 420 × 60⁄56 = 450 minutes = 7.5 hours. 8:00 + 7h30m = 15:30."
  },
  {
    tag:"Algebra word problem", time:70,
    q:"Concert tickets sell at 300 yuan each. After selling a batch at full price, the organizer cuts the price; the audience grows by half, and total revenue rises by 25%. What is the promotional price?",
    options:["150 yuan","180 yuan","220 yuan","250 yuan"],
    answer:0,
    why:"Say n tickets sold at 300 (revenue 300n). The price cut brings 0.5n more people at price p, adding 0.5n·p. That added revenue equals the 25% rise: 0.5n·p = 0.25 × 300n = 75n, so p = 150."
  },
  {
    tag:"Physics reasoning", time:55,
    q:"A spring expander is fixed to the ceiling at one end. You grip the other end and slowly pull it straight down. The spring has mass, spread evenly along its length. Where is it most likely to snap?",
    options:["At the top","In the middle","At the bottom","Top and bottom at the same time"],
    answer:0,
    why:"Tension at any cross-section equals your pulling force plus the weight of all the spring below that point. At the very top the spring carries your full pull AND the weight of the entire spring — the largest tension anywhere — so it breaks at the top."
  },
  {
    tag:"Optimization", time:75,
    q:"A firm buys 8 wastewater units total — type A and type B. A treats 240 t/month and costs 120,000 yuan each; B treats 160 t/month and costs 100,000 yuan each. Budget is at most 900,000 yuan, and total capacity must be at least 1,600 t/month. What is the most A units it can buy?",
    options:["3","4","5","6"],
    answer:2,
    why:"Let A = x, B = 8−x. Cost: 12x + 10(8−x) = 2x + 80 ≤ 90 → x ≤ 5. Capacity: 240x + 160(8−x) = 80x + 1280 ≥ 1600 → x ≥ 4. So x is 4 or 5 — the maximum is 5."
  },
  {
    tag:"Combinatorics — the brutal one", time:100,
    q:"A family of three travels. Solo photos + group photos = 68 in total. Group photos number one less than twice the solo photos. Of the group photos, two-thirds show all three (whole-family); and the child appears in exactly half as many group photos as mom and dad's group appearances combined. The child has 1 more solo photo than mom's and dad's solo photos combined. In how many photos does the child appear altogether?",
    options:["52","48","45","37"],
    answer:0,
    why:"Solo s + group g = 68 and g = 2s − 1 → s = 23, g = 45. Whole-family = ⅔×45 = 30; the other 15 are two-person shots. Letting dad+mom = a and (dad+child)+(mom+child) = b+c, the appearance condition gives a = (b+c)/2, with a + b + c = 15 → a = 5, b+c = 10. Solo photos: child = (dad+mom)+1, total 23 → child solo = 12. Child appears in 12 solo + 30 family + 10 two-person = 52."
  }
];

/* ===================== STATE ===================== */
const C=document.getElementById('content'), CLK=document.getElementById('clock');
const BAR=document.getElementById('bar'), FILL=document.getElementById('barfill');
const FLASH=document.getElementById('flash'), TOAST=document.getElementById('toast');
let results=[];           // {choice, correct, timedOut}
let score=0, timedOutCount=0;
let qStart=null, totalStart=null, totalMs=0;
let tick=null;

/* ===================== HELPERS ===================== */
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;}
function fmt(s){const m=Math.floor(s/60);return m+':'+String(Math.floor(s%60)).padStart(2,'0');}
let toastT=null;
function toast(m){TOAST.textContent=m;TOAST.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>TOAST.classList.remove('show'),1800);}

function go(fn){
  C.classList.add('leaving');
  setTimeout(()=>{C.innerHTML='';C.classList.remove('leaving');C.classList.add('blank');
    setTimeout(()=>{fn();C.scrollTop=0;C.classList.remove('blank');},170);},210);
}

/* ===================== TIMER ===================== */
function startClock(total){
  qStart=Date.now();
  BAR.classList.add('show'); CLK.classList.remove('idle');
  const run=()=>{
    const left=total-(Date.now()-qStart)/1000;
    const frac=Math.max(0,left/total);
    FILL.style.width=(frac*100)+'%';
    CLK.textContent=fmt(Math.max(0,left));
    if(frac<=0.25){CLK.classList.add('urgent');BAR.classList.add('urgent');}
    else{CLK.classList.remove('urgent');BAR.classList.remove('urgent');}
    if(left<=0){stopClock();handleTimeout();return;}
    tick=requestAnimationFrame(run);
  };
  run();
}
function stopClock(){cancelAnimationFrame(tick); CLK.classList.remove('urgent'); BAR.classList.remove('urgent');}
function hideClock(){stopClock();CLK.classList.add('idle');BAR.classList.remove('show');}

/* ===================== FLOW ===================== */
let cur=0;
function intro(){
  hideClock();
  const v=el(`<div>
    <div class="step">China · Civil Service Exam</div>
    <h1>3.4 million people. 39,000 jobs. Could you even pass the test?</h1>
    <p class="lead">This is the 行测 — the aptitude paper every applicant must clear. Real questions, translated, no edits. The catch is the same one candidates face: a clock on every question. Run out of time and it moves on without you.</p>
    <div class="stats">
      <div class="stat"><b>7</b><span>Questions</span></div>
      <div class="stat"><b>~8</b><span>Minutes</span></div>
      <div class="stat"><b>87:1</b><span>Odds/job</span></div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="start">Start the clock</button>
    <p class="note" style="text-align:center; margin-top:10px">Real candidates get under a minute per question — reading included.</p>
  </div>`);
  C.innerHTML='';C.appendChild(v);
  v.querySelector('#start').onclick=()=>{results=[];score=0;timedOutCount=0;cur=0;totalStart=Date.now();go(()=>question(0));};
}

function question(i){
  cur=i; const Q=QUESTIONS[i];
  const opts=Q.options.map((o,idx)=>({o,idx})); // keep A–D order (answers reference positions)
  const keys=['A','B','C','D'];
  const v=el(`<div>
    <div class="step">Question ${i+1} of ${QUESTIONS.length}<span class="qtag">· ${Q.tag}</span></div>
    <h2>${Q.q}</h2>
    <div class="choices" id="opts"></div>
    <div class="spacer"></div>
  </div>`);
  C.innerHTML='';C.appendChild(v);
  const box=v.querySelector('#opts');
  opts.forEach(({o,idx})=>{
    const b=el(`<button class="choice"><span class="key">${keys[idx]}</span><span>${o}</span></button>`);
    b.onclick=()=>answer(idx);
    box.appendChild(b);
  });
  startClock(Q.time);
}

function answer(choice){
  stopClock();
  const Q=QUESTIONS[cur], correct=choice===Q.answer;
  results[cur]={choice, correct, timedOut:false};
  if(correct) score++;
  advance();
}
function handleTimeout(){
  results[cur]={choice:-1, correct:false, timedOut:true};
  timedOutCount++;
  FLASH.classList.add('show');
  setTimeout(()=>{FLASH.classList.remove('show'); advance();},900);
}
function advance(){
  if(cur<QUESTIONS.length-1) go(()=>question(cur+1));
  else { totalMs=Date.now()-totalStart; hideClock(); go(results_screen); }
}

/* ===================== RESULTS ===================== */
function tierText(s,n){
  const p=s/n;
  if(p>=0.85) return "Exceptional. Even strong Chinese candidates lose marks here under the clock — you'd be in the fight.";
  if(p>=0.55) return "Respectable. But \u201Crespectable\u201D doesn't win when 87 people chase one seat.";
  if(p>=0.3)  return "Now you feel it. This is the wall 3.4 million people hit every year — and most don't clear it.";
  return "Humbling, isn't it? And remember: real candidates do 120+ of these in two hours, not 7.";
}

function results_screen(){
  hideClock();
  const total=QUESTIONS.length;
  const cards=QUESTIONS.map((Q,i)=>{
    const r=results[i]||{choice:-1,correct:false,timedOut:true};
    const keys=['A','B','C','D'];
    const vClass=r.timedOut?'out':(r.correct?'ok':'miss');
    const vText=r.timedOut?'TIMED OUT':(r.correct?'CORRECT':'WRONG');
    const yours=r.timedOut?'<span class="miss">Ran out of time</span>'
      :`<span class="${r.correct?'ok':'miss'}">${keys[r.choice]}. ${Q.options[r.choice]}</span>`;
    const showAnswer=!r.correct;
    return `<div class="card">
      <div class="ctag">Q${i+1} · ${Q.tag} <span class="verdict ${vClass}">${vText}</span></div>
      <div class="qt">${Q.q}</div>
      <div class="ans"><span class="k">You:</span> ${yours}</div>
      ${showAnswer?`<div class="ans"><span class="k">Answer:</span> <span class="ok">${keys[Q.answer]}. ${Q.options[Q.answer]}</span></div>`:''}
      <div class="why">${Q.why}</div>
    </div>`;
  }).join('');

  const v=el(`<div>
    <div class="step">Your result</div>
    <div class="score-ring"><span class="num">${score}</span><span class="den">/ ${total}</span></div>
    <div class="tier">${tierText(score,total)}</div>
    <div class="rmeta">
      <div class="stat"><b>${fmt(Math.round(totalMs/1000))}</b><span>Total time</span></div>
      <div class="stat"><b>${timedOutCount}</b><span>Timed out</span></div>
    </div>
    <p class="note">The 行测 isn't hard because any one question is impossible — it's hard because there are 120+ of them and the clock never stops. Speed is the real exam.</p>

    ${cards}

    <div class="cta">
      <p>How an ordinary uncle used AI to give his niece a fighting chance at this exam:</p>
      <a href="${BLOG_URL}" target="_blank" rel="noopener">Read the story →</a>
    </div>

    <div class="sharehead">Think your friends could pass it?</div>
    <div class="sharegrid">
      <button class="share s-x"  data-p="x">𝕏  Post</button>
      <button class="share s-fb" data-p="facebook">Facebook</button>
      <button class="share s-wa" data-p="whatsapp">WhatsApp</button>
      <button class="share s-rd" data-p="reddit">Reddit</button>
      <button class="share s-tg" data-p="telegram">Telegram</button>
      <button class="share s-cp" data-p="copy">Copy result</button>
    </div>

    <button class="btn" id="again" style="margin-top:12px">Try again</button>
    <button class="btn ghost" id="home">Back to start</button>
  </div>`);
  C.innerHTML='';C.appendChild(v);
  v.querySelectorAll('.share').forEach(b=>b.onclick=()=>share(b.dataset.p));
  v.querySelector('#again').onclick=()=>{results=[];score=0;timedOutCount=0;totalStart=Date.now();go(()=>question(0));};
  v.querySelector('#home').onclick=()=>go(intro);
}

/* ===================== SHARE ===================== */
function getShareUrl(){
  if(SHARE_URL.trim()) return SHARE_URL.trim();              // manual override wins
  if(location.protocol==='http:'||location.protocol==='https:')
    return location.origin+location.pathname;               // hosted: use this page's own URL
  return '';                                                 // local file: nothing public to share yet
}
function share(platform){
  const text=`I scored ${score}/${QUESTIONS.length} on China's civil-service aptitude test \u{1F1E8}\u{1F1F3} (and timed out on ${timedOutCount}). Think you can beat me?`;
  const url=getShareUrl(), t=encodeURIComponent(text), u=encodeURIComponent(url);
  if(platform==='copy'){
    const payload=text+(url?` ${url}`:'');
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(payload).then(()=>toast('Copied to clipboard'),()=>toast('Could not copy'));
    else toast('Copy not supported here');
    return;
  }
  let link='';
  switch(platform){
    case 'x':        link=`https://twitter.com/intent/tweet?text=${t}${url?'&url='+u:''}`; break;
    case 'facebook': if(!url){toast('Facebook sharing needs the page online first');return;} link=`https://www.facebook.com/sharer/sharer.php?u=${u}`; break;
    case 'whatsapp': link=`https://wa.me/?text=${encodeURIComponent(text+(url?' '+url:''))}`; break;
    case 'reddit':   link=`https://www.reddit.com/submit?title=${t}${url?'&url='+u:''}`; break;
    case 'telegram': link=`https://t.me/share/url?url=${u||t}&text=${t}`; break;
  }
  window.open(link,'_blank','noopener');
}

/* ===================== BOOT ===================== */
intro();
</script>

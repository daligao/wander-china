<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考英语语法填空专练 · 20套真题风格</title>

<style>
:root{
  --brand:#574AE2;--brand-deep:#3f34c0;--brand-soft:#ECEAFB;--brand-line:#CFC9F4;
  --bg:#EEF1F6;--card:#FFF;--ink:#1E2330;--ink-soft:#556;--faint:#8A93A6;
  --line:#E6E9F0;--ok:#1E9E6A;--ok-soft:#E6F6EE;--err:#D6455D;--err-soft:#FCEBEE;
  --warn:#E8930A;--warn-soft:#FFF3E0;
  --shadow:0 2px 10px rgba(30,35,48,.08);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.hd{background:var(--brand);color:#fff;padding:14px 15px 12px}
.hd h1{font-size:1.1rem;font-weight:700}
.hd p{font-size:.74rem;opacity:.75;margin-top:2px}
.wrap{max-width:720px;margin:0 auto;padding:14px 15px 80px}

/* Passage selector */
.ps-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:16px}
@media(max-width:400px){.ps-grid{grid-template-columns:repeat(4,1fr)}}
.ps-btn{padding:8px 4px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink-soft);font-family:var(--sans);font-size:.8rem;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.ps-btn:hover{border-color:var(--brand);color:var(--brand-deep)}
.ps-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.ps-btn.done{border-color:var(--ok);color:var(--ok)}
.ps-btn.done.active{background:var(--ok);color:#fff}
.ps-num{display:block;font-size:1rem;font-weight:800}
.ps-sc{display:block;font-size:.65rem;margin-top:1px}

/* Passage */
.passage-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.p-title{font-size:1rem;font-weight:700}
.p-tag{font-size:.72rem;background:var(--brand-soft);color:var(--brand-deep);border-radius:5px;padding:2px 8px;font-weight:600}
.p-score{font-size:.78rem;color:var(--faint);margin-left:auto}

.passage-text{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;line-height:2.1;font-size:.95rem;color:var(--ink);box-shadow:var(--shadow)}
.blank-wrap{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;margin:0 2px}
.blank-num{font-size:.68rem;color:var(--brand-deep);font-weight:700;vertical-align:super;line-height:1}
.blank-input{
  border:none;border-bottom:2px solid var(--brand-line);background:transparent;
  font-family:var(--sans);font-size:.93rem;color:var(--ink);padding:0 4px;
  min-width:70px;max-width:120px;width:auto;text-align:center;outline:none;
  transition:border-color .15s
}
.blank-input:focus{border-color:var(--brand)}
.blank-input.correct{border-color:var(--ok);background:var(--ok-soft);border-radius:4px}
.blank-input.wrong{border-color:var(--err);background:var(--err-soft);border-radius:4px}
.hint-word{font-size:.72rem;color:var(--faint);font-style:italic}

/* Actions */
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{padding:10px 20px;border-radius:10px;border:1.5px solid var(--brand);background:none;color:var(--brand-deep);font-family:var(--sans);font-size:.88rem;font-weight:600;cursor:pointer}
.btn.pri{background:var(--brand);color:#fff}
.btn:hover{opacity:.85}

/* Results */
.result-bar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-top:14px;box-shadow:var(--shadow);flex-wrap:wrap}
.r-score{font-size:1.4rem;font-weight:800;color:var(--brand-deep)}
.r-label{font-size:.8rem;color:var(--faint)}
.r-chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.rchip{font-size:.75rem;padding:3px 10px;border-radius:999px;font-weight:600}
.rchip.ok{background:var(--ok-soft);color:var(--ok)}
.rchip.err{background:var(--err-soft);color:var(--err)}

/* Explanation cards */
.exps{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.exp-card{border-radius:11px;padding:11px 13px;border:1px solid}
.exp-card.ok{background:var(--ok-soft);border-color:#a8dfc7}
.exp-card.err{background:var(--err-soft);border-color:#f0b8c0}
.exp-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.exp-n{font-size:.72rem;font-weight:800;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.exp-card.ok .exp-n{background:var(--ok);color:#fff}
.exp-card.err .exp-n{background:var(--err);color:#fff}
.exp-ans{font-size:.88rem;font-weight:700}
.exp-your{font-size:.78rem;color:var(--err)}
.exp-rule{font-size:.82rem;color:var(--ink-soft);margin-top:3px;line-height:1.5}

/* Nav buttons */
.passage-nav{display:flex;gap:8px;margin-top:16px;justify-content:space-between}
.passage-nav button{padding:9px 18px;border:1.5px solid var(--brand-line);border-radius:10px;background:var(--card);color:var(--brand-deep);font-family:var(--sans);font-size:.85rem;cursor:pointer;font-weight:600}
.passage-nav button:hover{border-color:var(--brand)}
.passage-nav button:disabled{opacity:.35;cursor:default}

/* Total progress */
.total-bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.total-bar .tl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--faint);margin-bottom:6px}
.pbar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.pfill{height:100%;background:var(--brand);border-radius:4px;transition:width .4s}
</style>
</head>

<div class="hd">
  <h1>📝 高考英语语法填空专练</h1>
  <p>20套真题风格 · 每套10空 · 自动判分+语法解析</p>

<script>
// ============================================================
// PASSAGE DATA — 20套，每套10空
// parts数组：字符串 = 正文，对象 = 空格
// hint: 给出的词（需变形），ans: 正确答案，rule: 语法解析

// ============================================================
const P=[
  // ── P1 睡眠与青少年 ──
  {id:1,title:'Sleep and Teenagers',topic:'健康',
   parts:[
    'Most teenagers do not get ',{n:1,hint:'',ans:'the',rule:'the sleep they need — 特指他们所需要的睡眠，用定冠词 the'},
    ' sleep they need. Experts recommend that young people sleep ',{n:2,hint:'',ans:'at',rule:'at least = 至少，固定搭配'},
    ' least eight hours per night. ',{n:3,hint:'',ans:'However',rule:'上文说应睡8小时，下文说实际不足7小时，转折用 However'},
    ', studies show that the average teenager gets less than seven hours.\n\nSleep deprivation affects students seriously. Those ',{n:4,hint:'',ans:'who',rule:'定语从句修饰Those，指人，用关系代词 who'},
    ' do not sleep enough find it hard to concentrate in class. Their ability ',{n:5,hint:'learn',ans:'to learn',rule:'ability to do sth — 不定式作定语，hint: learn → to learn'},
    ' new information is greatly reduced. In fact, sleeping after ',{n:6,hint:'study',ans:'studying',rule:'after + doing — 介词后接动名词，hint: study → studying'},
    ' helps the brain store memories more ',{n:7,hint:'effect',ans:'effectively',rule:'修饰动词store，需用副词，hint: effect → effectively'},
    ' effectively.\n\nAnother problem is that many teenagers stay up late ',{n:8,hint:'look',ans:'looking',rule:'spend/stay up late + doing — 伴随状语，hint: look → looking'},
    ' at their phones. The blue light from screens can prevent the brain ',{n:9,hint:'',ans:'from',rule:'prevent sb from doing — 固定搭配，用介词 from'},
    ' ',{n:10,hint:'produce',ans:'producing',rule:'prevent from + doing，hint: produce → producing'},
    ' melatonin, the chemical that helps us fall asleep.'
   ]},

  // ── P2 社交媒体 ──
  {id:2,title:'The Double-Edged Sword of Social Media',topic:'科技',
   parts:[
    'Social media has completely ',{n:1,hint:'change',ans:'changed',rule:'has + 过去分词 — 现在完成时，hint: change → changed'},
    ' the way people communicate. Billions of people now use platforms such ',{n:2,hint:'',ans:'as',rule:'such as = 例如，固定搭配，引出举例'},
    ' Facebook and WeChat. These tools make it ',{n:3,hint:'easy',ans:'easier',rule:'与 than before 呼应，用比较级，hint: easy → easier'},
    ' to stay in touch with others than ever before.\n\n',{n:4,hint:'',ans:'However',rule:'转折：上文说优点，下文讲缺点，用 However'},
    ', social media also has its disadvantages. Many people spend too much time scrolling instead of ',{n:5,hint:'focus',ans:'focusing',rule:'instead of + doing，hint: focus → focusing'},
    ' on real-life activities. Heavy social media use is linked ',{n:6,hint:'',ans:'to',rule:'be linked to = 与……有关，固定搭配'},
    ' loneliness and depression.\n\nAnother concern is privacy. Personal information may be ',{n:7,hint:'collect',ans:'collected',rule:'被动语态 may be + 过去分词，hint: collect → collected'},
    ' by companies without your knowledge. This is why you should think carefully about what you ',{n:8,hint:'post',ans:'post',rule:'you post — 主语you是第二人称，一般现在时动词原形，hint: post → post（无变化）'},
    ' online.\n\n',{n:9,hint:'Find',ans:'Finding',rule:'动名词作主语，hint: Find → Finding'},
    ' the right balance is key. Social media can be a wonderful tool as long as it does not take over our ',{n:10,hint:'',ans:'lives',rule:'our lives — 泛指生活，用复数 lives'},
    '.'
   ]},

  // ── P3 爱迪生 ──
  {id:3,title:'Thomas Edison: A Man of Perseverance',topic:'人物传记',
   parts:[
    'Thomas Edison is one of the ',{n:1,hint:'great',ans:'greatest',rule:'one of the + 最高级 + 复数名词，hint: great → greatest'},
    ' inventors in history. Born in 1847 in Ohio, Edison showed strong curiosity from an early age. ',{n:2,hint:'',ans:'However',rule:'转折：爱好学习，却几乎没有正规教育，用 However'},
    ', he had very little formal schooling. His mother, ',{n:3,hint:'',ans:'who',rule:'非限制性定语从句，修饰His mother，指人用 who'},
    ' was a teacher, educated him at home.\n\nEdison\'s most famous invention is the electric light bulb, ',{n:4,hint:'develop',ans:'developed',rule:'过去分词作定语（=which was developed），hint: develop → developed'},
    ' in 1879. He also contributed greatly to the ',{n:5,hint:'develop',ans:'development',rule:'to是介词，后接名词，hint: develop → development'},
    ' of the motion picture camera. In total, he held over 1,000 ',{n:6,hint:'patent',ans:'patents',rule:'over 1,000后接复数，hint: patent → patents'},
    ' in his lifetime.\n\nEdison was famous for his incredible work ethic. He believed success comes not from ',{n:7,hint:'be',ans:'being',rule:'not from + doing，介词后接动名词，hint: be → being'},
    ' talented, but from working hard. He once said that genius is one percent inspiration and ',{n:8,hint:'nine',ans:'ninety-nine',rule:'他的名言：天才是1%灵感加99%汗水，hint: nine → ninety-nine'},
    ' percent perspiration.\n\nEdison\'s inventions have had a lasting ',{n:9,hint:'impact',ans:'impact',rule:'have a lasting impact on — 固定搭配，impact前已有a lasting，无需变形'},
    ' on the world. Today, it is very hard to imagine life without ',{n:10,hint:'',ans:'electricity',rule:'没有电 — 自填 electricity（与发明电灯泡呼应）'},
    '.'
   ]},

  // ── P4 中国春节 ──
  {id:4,title:'The Chinese Spring Festival',topic:'传统文化',
   parts:[
    'Chinese New Year, also ',{n:1,hint:'know',ans:'known',rule:'also known as — 固定短语，过去分词，hint: know → known'},
    ' as the Spring Festival, is the most important holiday in China. It falls on the first day of the Chinese lunar calendar, ',{n:2,hint:'',ans:'which',rule:'非限制性定语从句，修饰calendar（物），用 which'},
    ' usually falls between January and February.\n\nPreparations begin weeks in ',{n:3,hint:'',ans:'advance',rule:'in advance = 提前，固定短语'},
    '. Families clean their houses to sweep away bad luck. Windows and doors are ',{n:4,hint:'decorate',ans:'decorated',rule:'被动语态 are + 过去分词，hint: decorate → decorated'},
    ' with red paper cutouts ',{n:5,hint:'bear',ans:'bearing',rule:'现在分词作定语（修饰paper cutouts），hint: bear → bearing'},
    ' phrases such as "福" (fortune).\n\nOn New Year\'s Eve, families gather ',{n:6,hint:'share',ans:'to share',rule:'目的状语 to do，gather to do = 聚在一起分享，hint: share → to share'},
    ' a special dinner. Traditional foods include fish, ',{n:7,hint:'',ans:'which',rule:'非限制性定语从句修饰fish（物），用which'},
    ' represents abundance, and dumplings.\n\nThe festival lasts for fifteen days and ends ',{n:8,hint:'',ans:'with',rule:'end with = 以……结束，固定搭配'},
    ' the Lantern Festival. On that night, people carry colorful lanterns and ',{n:9,hint:'enjoy',ans:'enjoy',rule:'并列谓语 carry and enjoy，主语people是复数，enjoy无需变形'},
    ' fireworks. The Spring Festival is not just a holiday — it is a time for ',{n:10,hint:'',ans:'family',rule:'春节最核心的主题是family reunion，自填 family'},
    ' reunion.'
   ]},

  // ── P5 阅读的益处 ──
  {id:5,title:'The Benefits of Reading',topic:'教育',
   parts:[
    'Reading is one of the most ',{n:1,hint:'value',ans:'valuable',rule:'修饰名词habits，需用形容词，hint: value → valuable'},
    ' habits a person can develop. Unlike watching television, reading requires ',{n:2,hint:'act',ans:'active',rule:'修饰名词engagement，需形容词，hint: act → active'},
    ' mental engagement. It forces the brain to process information deeply.\n\nResearch shows that people ',{n:3,hint:'',ans:'who',rule:'定语从句修饰people（指人），用关系代词 who'},
    ' read regularly have better memory and lower stress levels. Reading also improves vocabulary; in fact, students who read for thirty minutes a day know far more words ',{n:4,hint:'',ans:'than',rule:'far more...than...比较结构，用than'},
    ' those who do not.\n\nBooks also provide a window into worlds beyond our own. By ',{n:5,hint:'read',ans:'reading',rule:'by + doing，介词后接动名词，hint: read → reading'},
    ' fiction, we can develop empathy by ',{n:6,hint:'see',ans:'seeing',rule:'by + doing，hint: see → seeing'},
    ' life through different eyes.\n\nDespite the rise of digital media, books remain important. Many experts argue that physical books are ',{n:7,hint:'',ans:'better',rule:'better than e-books — 比较级，自填 better'},
    ' than e-books for deep reading, as screens can cause eye strain. ',{n:8,hint:'',ans:'Whether',rule:'Whether you prefer...or... — 无论……都……，引导让步状语从句'},
    ' you prefer fiction or non-fiction, making reading a daily ',{n:9,hint:'',ans:'habit',rule:'a daily habit = 每日习惯，habit是可数名词，前有a，填单数'},
    ' is one of the best investments you can make ',{n:10,hint:'',ans:'in',rule:'invest in yourself — 固定搭配，make an investment in'},
    ' yourself.'
   ]},

  // ── P6 志愿服务 ──
  {id:6,title:'The Value of Volunteering',topic:'社会',
   parts:[
    'Volunteering means giving your time to help others ',{n:1,hint:'',ans:'without',rule:'without receiving payment = 不领报酬，固定搭配'},
    ' receiving payment. Millions of people volunteer for a wide range of ',{n:2,hint:'cause',ans:'causes',rule:'a wide range of后接复数名词，hint: cause → causes'},
    '.\n\n',{n:3,hint:'Volunteer',ans:'Volunteering',rule:'动名词作主语，hint: Volunteer → Volunteering'},
    ' benefits not only the community but also the volunteers themselves. Studies show that people who regularly volunteer report higher levels of ',{n:4,hint:'happy',ans:'happiness',rule:'levels of后接名词，hint: happy → happiness'},
    ' and life satisfaction ',{n:5,hint:'',ans:'than',rule:'higher...than...比较结构，用than'},
    ' those who do not.\n\nFor young people, volunteering is a great way to develop skills ',{n:6,hint:'',ans:'such as',rule:'such as = 例如，引出具体技能列举'},
    ' teamwork and communication. These skills are very ',{n:7,hint:'use',ans:'useful',rule:'修饰skills，需形容词，hint: use → useful'},
    ' in future careers.\n\nIf you are thinking about ',{n:8,hint:'start',ans:'starting',rule:'think about + doing，hint: start → starting'},
    ' to volunteer, start small. Choose a cause you feel ',{n:9,hint:'passion',ans:'passionate',rule:'feel passionate about = 对……充满热情，hint: passion → passionate'},
    ' about. Even a few hours a week can make a ',{n:10,hint:'',ans:'difference',rule:'make a difference = 产生影响/有所不同，固定搭配'},
    '.'
   ]},

  // ── P7 网购 ──
  {id:7,title:'The Rise of Online Shopping',topic:'科技与消费',
   parts:[
    'Online shopping has ',{n:1,hint:'transform',ans:'transformed',rule:'has + 过去分词，现在完成时，hint: transform → transformed'},
    ' the retail industry over the past two decades. Today, people can buy almost anything from the comfort of their own homes.\n\nThe ',{n:2,hint:'convenient',ans:'convenience',rule:'定冠词The后接名词，hint: convenient → convenience'},
    ' of online shopping is its biggest advantage. Customers can compare prices and have items ',{n:3,hint:'deliver',ans:'delivered',rule:'have sth done = 使役结构（物品被送到），hint: deliver → delivered'},
    ' directly to their doors.\n\n',{n:4,hint:'',ans:'However',rule:'转折：上文讲优点，下文讲缺点，用 However'},
    ', online shopping also has drawbacks. It is difficult to judge the ',{n:5,hint:'',ans:'quality',rule:'judge the quality of a product — 判断商品质量，自填 quality'},
    ' of a product just by looking at pictures. Items may look different ',{n:6,hint:'',ans:'when',rule:'when they arrive — 时间状语从句，自填 when'},
    ' they arrive. Furthermore, returning ',{n:7,hint:'',ans:'an',rule:'an item — item是可数名词单数，元音开头用 an'},
    ' item can be time-consuming.\n\nThere is also the issue of overspending. Online stores show targeted advertisements ',{n:8,hint:'design',ans:'designed',rule:'过去分词作定语（=which are designed），hint: design → designed'},
    ' to tempt shoppers. It is important ',{n:9,hint:'',ans:'for',rule:'It is important for sb to do — 固定句型，用 for'},
    ' consumers to develop self-control. If in doubt, wait 24 hours before ',{n:10,hint:'make',ans:'making',rule:'before + doing，介词后动名词，hint: make → making'},
    ' a purchase.'
   ]},

  // ── P8 音乐与大脑 ──
  {id:8,title:'Music and the Brain',topic:'科学',
   parts:[
    'Music has a powerful effect on the human brain. ',{n:1,hint:'',ans:'When',rule:'When we listen...时间状语从句，引导词 When'},
    ' we listen to music, our brains release dopamine, a chemical ',{n:2,hint:'associate',ans:'associated',rule:'过去分词作定语（=which is associated with），hint: associate → associated'},
    ' with pleasure. This is why music can make us feel happy, sad, or ',{n:3,hint:'excite',ans:'excited',rule:'make us feel + 形容词（表感受），hint: excite → excited'},
    '.\n\nLearning to play an instrument has many benefits. Playing music requires ',{n:4,hint:'',ans:'both',rule:'both...and... — 固定结构，requires both hands and...'},
    ' hands simultaneously, which stimulates both sides of the brain. This can improve ',{n:5,hint:'',ans:'concentration',rule:'improve concentration = 提高注意力，自填 concentration'},
    ' and even mathematical ability.\n\nMusic can also help people deal ',{n:6,hint:'',ans:'with',rule:'deal with = 应对/处理，固定搭配'},
    ' stress and anxiety. Many hospitals now use music therapy to help patients recover from ',{n:7,hint:'ill',ans:'illness',rule:'recover from illness，hint: ill → illness（名词）'},
    ' more quickly. The soothing effect of calm music has ',{n:8,hint:'prove',ans:'been proved',rule:'现在完成时被动：has been proved，hint: prove → been proved'},
    ' to lower blood pressure.\n\n',{n:9,hint:'',ans:'However',rule:'转折：上文说益处，下文提出不同看法'},
    ', not everyone agrees on what type of music is best. Some studies suggest that classical music is particularly ',{n:10,hint:'benefit',ans:'beneficial',rule:'修饰music，需形容词，hint: benefit → beneficial'},
    ' for concentration.'
   ]},

  // ── P9 志愿者故事（记叙文） ──
  {id:9,title:'A Summer to Remember',topic:'记叙文',
   parts:[
    'Last summer, Li Ming decided ',{n:1,hint:'join',ans:'to join',rule:'decide to do sth — 不定式，hint: join → to join'},
    ' a volunteer program at a local hospital. He had always wanted to do something ',{n:2,hint:'meaning',ans:'meaningful',rule:'修饰something，需形容词，hint: meaning → meaningful'},
    ' during his vacation.\n\nOn his first day, Li Ming felt nervous. He was ',{n:3,hint:'assign',ans:'assigned',rule:'被动语态 was + 过去分词，hint: assign → assigned'},
    ' to the children\'s ward, ',{n:4,hint:'',ans:'where',rule:'关系副词where修饰地点先行词the children\'s ward'},
    ' he helped nurses and spent time reading stories to young patients.\n\n',{n:5,hint:'',ans:'Gradually',rule:'随着时间推移他逐渐喜欢上了工作，自填 Gradually（逐渐地）'},
    ', Li Ming began to enjoy the work. He discovered that a simple smile could make a huge difference to a child ',{n:6,hint:'',ans:'who',rule:'定语从句修饰a child（指人），用 who'},
    ' was feeling lonely. ',{n:7,hint:'see',ans:'Seeing',rule:'现在分词作主语（动名词形式更自然），hint: see → Seeing'},

// ============================================================
// APP STATE
// ============================================================
const LS='gcloze_scores_v1';
let cur=0; // current passage index

function loadScores(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}
function saveScore(pid,score){const s=loadScores();s[pid]=score;try{localStorage.setItem(LS,JSON.stringify(s))}catch(e){}}

// ============================================================
// RENDER
// ============================================================
function render(){
  renderTotal();
  renderGrid();
  renderPassage();
}

function renderTotal(){
  const scores=loadScores();
  const done=Object.keys(scores).length;
  const total=P.length;
  const pct=done===0?0:Math.round(done/total*100);
  document.getElementById('total-area').innerHTML=`
    <div class="total-bar">
      <div class="tl"><span>总进度：已完成 ${done}/${total} 套</span><span>${pct}%</span></div>
      <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
    </div>`;
}

function renderGrid(){
  const scores=loadScores();
  document.getElementById('ps-grid').innerHTML=P.map((p,i)=>{
    const sc=scores[p.id];
    const isDone=sc!=null;
    const isActive=i===cur;
    return `<button class="ps-btn${isActive?' active':''}${isDone&&!isActive?' done':''}" onclick="goTo(${i})">
      <span class="ps-num">${p.id}</span>
      <span class="ps-sc">${isDone?sc+'/10':'未做'}</span>
    </button>`;
  }).join('');
}

function renderPassage(){
  const p=P[cur];
  const area=document.getElementById('passage-area');
  const scores=loadScores();
  const sc=scores[p.id];

  // Build passage HTML
  let html=`<div class="passage-meta">
    <span class="p-title">第${p.id}套 · ${p.title}</span>
    <span class="p-tag">${p.topic}</span>
    ${sc!=null?`<span class="p-score">上次得分：${sc}/10</span>`:''}
  </div>
  <div class="passage-text" id="ptext">`;

  p.parts.forEach(part=>{
    if(typeof part==='string'){
      html+=part.replace(/\n/g,'<br>');
    } else {
      const hintHtml=part.hint?`<span class="hint-word">(${part.hint})</span>`:'';
      html+=`<span class="blank-wrap"><sup class="blank-num">${part.n}</sup><input class="blank-input" id="b${part.n}" type="text" placeholder="    " autocomplete="off" autocorrect="off" spellcheck="false">${hintHtml}</span>`;
    }
  });

  html+=`</div>
  <div class="actions">
    <button class="btn pri" onclick="checkAll()">✓ 核对答案</button>
    <button class="btn" onclick="clearAll()">↺ 清除重写</button>
  </div>
  <div id="result-area"></div>
  <div class="passage-nav">
    <button onclick="goTo(${cur-1})" ${cur===0?'disabled':''}>← 上一套</button>
    <button onclick="goTo(${cur+1})" ${cur===P.length-1?'disabled':''}>下一套 →</button>
  </div>`;

  area.innerHTML=html;

  // Auto-size inputs
  document.querySelectorAll('.blank-input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      inp.style.width=Math.max(60,inp.value.length*11+16)+'px';
    });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        const n=parseInt(inp.id.slice(1));
        const next=document.getElementById('b'+(n+1));
        if(next)next.focus();
      }
    });
  });
}

function checkAll(){
  const p=P[cur];
  const blanks=p.parts.filter(x=>typeof x==='object');
  let correct=0;
  const results=[];

  blanks.forEach(b=>{
    const inp=document.getElementById('b'+b.n);
    if(!inp)return;
    const user=inp.value.trim().toLowerCase();
    const ans=b.ans.toLowerCase();
    // Accept multiple acceptable answers (separated by /)
    const accepted=ans.split('/').map(x=>x.trim());
    const isOk=accepted.some(a=>user===a||user.replace(/\s+/g,' ')===a.replace(/\s+/g,' '));
    if(isOk){correct++;inp.classList.add('correct');inp.classList.remove('wrong');}
    else{inp.classList.add('wrong');inp.classList.remove('correct');}
    results.push({n:b.n,ok:isOk,ans:b.ans,user:inp.value.trim(),rule:b.rule});
  });

  saveScore(p.id,correct);
  renderGrid();
  renderTotal();

  // Show result bar
  const pct=Math.round(correct/10*100);
  const emoji=correct>=9?'🏆':correct>=7?'👍':correct>=5?'📚':'💪';
  let resHtml=`<div class="result-bar">
    <div>
      <div class="r-score">${correct}/10</div>
      <div class="r-label">正确率 ${pct}% ${emoji}</div>
    </div>
    <div class="r-chips">
      <span class="rchip ok">✅ 正确 ${correct}</span>
      <span class="rchip err">❌ 错误 ${10-correct}</span>
    </div>
  </div>
  <div class="exps">`;

  results.forEach(r=>{
    resHtml+=`<div class="exp-card ${r.ok?'ok':'err'}">
      <div class="exp-head">
        <div class="exp-n">${r.n}</div>
        <div>
          <div class="exp-ans">${r.ok?'✓':'✗'} 答案：${r.ans}</div>
          ${!r.ok&&r.user?`<div class="exp-your">你的答案：${r.user}</div>`:''}
        </div>
      </div>
      <div class="exp-rule">${r.rule}</div>
    </div>`;
  });
  resHtml+='</div>';

  document.getElementById('result-area').innerHTML=resHtml;
  document.getElementById('result-area').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function clearAll(){
  document.querySelectorAll('.blank-input').forEach(inp=>{
    inp.value='';inp.style.width='';
    inp.classList.remove('correct','wrong');
  });
  document.getElementById('result-area').innerHTML='';
}

function goTo(i){
  if(i<0||i>=P.length)return;
  cur=i;render();
  document.querySelector('.wrap').scrollIntoView({behavior:'smooth'});
}

// ============================================================
// INIT
// ============================================================
render();
</script>
</body>
</html>
